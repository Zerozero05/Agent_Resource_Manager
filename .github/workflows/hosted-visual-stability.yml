name: Run approved native visual pilot and stability acceptance
on: create
permissions:
  contents: read
  actions: read
env:
  REFERENCE_BRANCH: 'codex/hosted-visual-references-0ac5e79-20261121'
  REFERENCE_RUN_ID: '44882371908'
  REFERENCE_COMMIT: 'd96ab4294b36de2d4a56eccdd2e3d875b7e107a1'
  REFERENCE_REVIEW_ARTIFACT_ID: '14698254292'
  REFERENCE_ROI_ARTIFACT_ID: '14698443675'
  REFERENCE_RECEIPT_SHA256: 'dfb058807162f5b4358ceab58007b5858886cc1f5fd195c0a73dbfabb53d2f9c'
  APPROVAL_SHA256: '916e058c916cd5c57db4753e3d791135ecb757ba2e2e1dd7e2506921f7529836'
jobs:
  stability:
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'codex/hosted-visual-stability-wrapper-r2-0ac5e79-20261121' && github.repository == 'Zerozero05/Agent_Resource_Manager' }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require frozen references and the recorded visual review
        run: |
          if ($env:REFERENCE_BRANCH -cnotmatch '^codex/hosted-visual-references-0ac5e79-20261121$' -or
              $env:REFERENCE_RUN_ID -cnotmatch '^[0-9]+$' -or
              $env:REFERENCE_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or
              $env:REFERENCE_REVIEW_ARTIFACT_ID -cnotmatch '^[0-9]+$' -or
              $env:REFERENCE_ROI_ARTIFACT_ID -cnotmatch '^[0-9]+$' -or
              $env:REFERENCE_RECEIPT_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:APPROVAL_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Complete references and a review of the rendered screenshots are required.'
          }
          $approval = Get-Item -LiteralPath 'outputs/v1-validation/hosted-visual-approval-0ac5e79.json'
          if ($approval.PSIsContainer -or ($approval.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              (Get-FileHash -LiteralPath $approval.FullName -Algorithm SHA256).Hash -ine $env:APPROVAL_SHA256) {
            throw 'The visual review digest does not match this workflow.'
          }
          $review = Get-Content -Raw -LiteralPath $approval.FullName | ConvertFrom-Json
          if ($review.reviewedBy -cne 'root' -or $review.visualReviewConfirmed -ne $true -or
              $review.referenceSha256 -cnotmatch '^[a-f0-9]{64}$' -or @($review.reviewedStates).Count -ne 72) {
            throw 'Review authority, scope, or reference binding is absent.'
          }
          $wrapper = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'arm-visual-wrapper')
          Copy-Item -LiteralPath 'scripts/run-hosted-visual-stability.ps1','scripts/quit-physical-memory-session.ps1' -Destination $wrapper.FullName
          Copy-Item -LiteralPath $approval.FullName -Destination (Join-Path $wrapper.FullName 'visual-approval.json')
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REFERENCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify and retrieve only the pinned reference and candidate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $candidateRun = '44880393531'
          $candidateCommit = '0ac5e79b7a3d1184e7602f241793f240b0609d44'
          $candidateSha = 'ff646e533f23749f96f09f6d79b7fad650bd035931b851b2710315eda64fdd24'
          $candidateArchiveSha = '5ea596eb7d95de7df46bc1929c8694e56c8c5b72f7ded2915987aefa83ce152e'
          function Read-Run([string]$id, [string]$commit, [string]$workflow, [string]$event) {
            $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$id" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $run.conclusion -cne 'success' -or $run.status -cne 'completed' -or
                $run.head_sha -cne $commit -or $run.path -cne ".github/workflows/$workflow" -or $run.event -cne $event -or $run.run_attempt -ne 1) {
              throw 'The upstream job does not match the exact successful attempt.'
            }
            return $run
          }
          function Get-Artifact([string]$run, [string]$id, [string]$name, [string]$target, [string]$archiveSha = '') {
            $response = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$run/artifacts" | ConvertFrom-Json
            $match = @($response.artifacts | Where-Object { $_.name -ceq $name -and $_.id -eq $id -and -not $_.expired })
            if ($LASTEXITCODE -ne 0 -or $match.Count -ne 1 -or (Test-Path -LiteralPath $target) -or
                ($archiveSha -and $match[0].digest -cne "sha256:$archiveSha")) { throw 'A pinned upstream artifact is unavailable.' }
            gh run download $run --repo $env:GITHUB_REPOSITORY --name $name --dir $target
            if ($LASTEXITCODE -ne 0) { throw 'A pinned upstream artifact could not be read.' }
          }
          $refs = Read-Run $env:REFERENCE_RUN_ID $env:REFERENCE_COMMIT 'hosted-visual-references.yml' 'create'
          if ($refs.head_branch -cne $env:REFERENCE_BRANCH) { throw 'Unexpected reference source branch.' }
          $null = Read-Run $candidateRun $candidateCommit 'check.yml' 'push'
          $review = Join-Path $env:RUNNER_TEMP 'arm-visual-approved-review'
          Get-Artifact $env:REFERENCE_RUN_ID $env:REFERENCE_REVIEW_ARTIFACT_ID "Agent_Resource_Manager_visual_references_$($env:REFERENCE_RUN_ID)_1" $review
          $rois = Join-Path $env:RUNNER_TEMP 'arm-visual-approved-rois'
          Get-Artifact $env:REFERENCE_RUN_ID $env:REFERENCE_ROI_ARTIFACT_ID "Agent_Resource_Manager_visual_reference_rois_$($env:REFERENCE_RUN_ID)_1" $rois
          $candidate = Join-Path $env:RUNNER_TEMP 'arm-native-performance'
          Get-Artifact $candidateRun '14698411078' "Agent_Resource_Manager_v0.3.0-dev.1_windows_x64_candidate_$candidateCommit" $candidate $candidateArchiveSha
          $source = Join-Path $candidate 'BUILD_INFO.json'
          $info = Get-Content -LiteralPath $source -Raw | ConvertFrom-Json
          $digest = (Get-FileHash -LiteralPath (Join-Path $candidate 'agent-resource-manager.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne $candidateSha -or $info.executableSha256 -cne $digest -or $info.sourceCommit -cne $candidateCommit -or
              $info.workflowRunId -ne $candidateRun -or $info.workflowRunAttempt -ne 1 -or $info.repository -cne $env:GITHUB_REPOSITORY -or
              $info.version -cne '0.3.0-dev.1') { throw 'The candidate artifact identity changed.' }
          $info | Add-Member -NotePropertyName buildMode -NotePropertyValue 'release'
          $info | Add-Member -NotePropertyName originalBuildInfoSha256 -NotePropertyValue ((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant())
          $info | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $candidate 'BUILD_INFO.native-validation.json') -Encoding utf8NoBOM
      - name: Rehydrate the frozen fixture and run the original pilot and stability modes
        timeout-minutes: 54
        run: |
          $wrapper = Join-Path $env:RUNNER_TEMP 'arm-visual-wrapper'
          & (Join-Path $wrapper 'run-hosted-visual-stability.ps1') -ReviewBundle (Join-Path $env:RUNNER_TEMP 'arm-visual-approved-review') `
            -RoiBundle (Join-Path $env:RUNNER_TEMP 'arm-visual-approved-rois') -ApprovalFile (Join-Path $wrapper 'visual-approval.json') `
            -ApprovalSha256 $env:APPROVAL_SHA256 -ReferenceReceiptSha256 $env:REFERENCE_RECEIPT_SHA256 -ReferenceCommit $env:REFERENCE_COMMIT `
            -ReferenceRunId $env:REFERENCE_RUN_ID
      - name: Preserve original pilot and stability reports and verified normal exit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Agent_Resource_Manager_visual_stability_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm-visual-stability-result/
          if-no-files-found: warn
          retention-days: 14
