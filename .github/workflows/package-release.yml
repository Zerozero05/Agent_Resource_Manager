name: Verify d2883c2 Windows review packages and installer lifecycle
on: create
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-installer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'codex/hosted-delivery-d2883c2' }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # The validation ref consumes the existing finalized candidate.
      CANDIDATE_RUN_ID: '44349985187'
      CANDIDATE_SOURCE: d2883c225a13af1e2f6b3c6597bf6ec90ae4d55b
      CANDIDATE_ARTIFACT: Agent_Resource_Manager_v0.3.0-dev.1_windows_x64_candidate_d2883c225a13af1e2f6b3c6597bf6ec90ae4d55b
      EXPECTED_EXECUTABLE_SHA256: 00f3b75bd175ca0433bf477ecf79f8fdfa941c1f0ebe6760c6e107d8f62fe17c
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Verify the candidate run and independent executable pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:EXPECTED_EXECUTABLE_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw 'An independently verified candidate executable SHA256 is required.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -cne 'success' -or $run.head_sha -cne $env:CANDIDATE_SOURCE -or
              $run.run_attempt -ne 1 -or $run.path -cne '.github/workflows/check.yml' -or $run.event -cne 'push') {
            throw 'The exact successful candidate run is not available.'
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install locked packaging tools
        run: |
          npm install --global pnpm@11.25.0
          if ($LASTEXITCODE -ne 0) { throw 'Package manager installation failed' }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Locked packaging tool installation failed' }
      - name: Verify candidate and prepare seven files inside the runner
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $workflowCommit = $env:GITHUB_SHA
          $productCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $productCommit -cne $env:CANDIDATE_SOURCE -or $workflowCommit -notmatch '^[0-9a-f]{40}$') {
            throw 'The checked-out source does not match the pinned candidate commit.'
          }
          $changes = @(git diff --name-only $productCommit $workflowCommit --)
          if ($LASTEXITCODE -ne 0 -or $changes.Count -ne 1 -or $changes[0] -cne '.github/workflows/package-release.yml') {
            throw 'The workflow commit contains unexpected source differences.'
          }
          Write-Output "Workflow commit $workflowCommit preparing exact source tree $productCommit"
          try {
            $env:GITHUB_SHA = $productCommit
            ./scripts/prepare-release.ps1 -CandidateRunId $env:CANDIDATE_RUN_ID -CandidateArtifact $env:CANDIDATE_ARTIFACT -ExpectedExecutableSha256 $env:EXPECTED_EXECUTABLE_SHA256
          } finally {
            $env:GITHUB_SHA = $workflowCommit
          }
      - name: Verify the installed upgrade on a hosted Windows runner
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') {
            throw 'The installer lifecycle must run in a fresh GitHub-hosted Windows VM'
          }
          $legacyName = 'Skill_Manager_v0.2.11_windows_x64_setup.exe'
          $legacy = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'arm-legacy-setup')
          try {
            gh release download v0.2.11 --repo $env:GITHUB_REPOSITORY --pattern $legacyName --dir $legacy.FullName
            if ($LASTEXITCODE -ne 0) { throw 'The published v0.2.11 baseline installer could not be downloaded' }
          } finally {
            $env:GH_TOKEN = $null
          }
          $name = "Agent_Resource_Manager_v$($env:VERIFIED_VERSION)_windows_x64_setup.exe"
          $assetDirectory = Join-Path $env:GITHUB_WORKSPACE 'outputs/release-assets'
          $checksums = @(Get-Content -LiteralPath (Join-Path $assetDirectory 'SHA256SUMS.txt'))
          $packageFiles = @(Get-ChildItem -LiteralPath $assetDirectory -Force)
          if ($checksums.Count -ne 6 -or $packageFiles.Count -ne 7 -or @($packageFiles | Where-Object { $_.PSIsContainer }).Count) {
            throw 'Expected six checked review files and one checksum manifest.'
          }
          $seen = @{}
          foreach ($line in $checksums) {
            if ($line -cnotmatch '^([0-9a-f]{64})  ([A-Za-z0-9_.-]+)$') { throw 'Malformed review file checksum.' }
            $hash, $fileName = $Matches[1], $Matches[2]
            if ($seen.ContainsKey($fileName) -or $fileName -in @('.', '..', 'SHA256SUMS.txt') -or
                (Get-FileHash -LiteralPath (Join-Path $assetDirectory $fileName) -Algorithm SHA256).Hash -ine $hash) {
              throw 'Duplicate or changed review file.'
            }
            $seen[$fileName] = $hash
          }
          $manifest = Get-Content -LiteralPath (Join-Path $assetDirectory 'SOURCE_MANIFEST.json') -Raw | ConvertFrom-Json
          if (-not $seen.ContainsKey($name) -or $manifest.sourceCommit -cne $env:CANDIDATE_SOURCE -or
              $manifest.candidateBuildCommit -cne $env:CANDIDATE_SOURCE -or
              $manifest.installerExecutableSha256 -cne $env:EXPECTED_EXECUTABLE_SHA256 -or
              $manifest.portableExecutableSha256 -cne $env:EXPECTED_EXECUTABLE_SHA256) {
            throw 'Review manifest does not match the exact source and both packaged executables.'
          }
          $parameters = @{
            OldSetup = (Join-Path $legacy.FullName $legacyName)
            OldSetupSha256 = 'd1a439fe476d05736c21bb6ee8c59e0ae0bbdaae54943106b5ec3a0b5dbf76aa'
            OldExecutableSha256 = '1ca90747eca2ac3229762928d05036724229e910463c28be40925e9b2fb2092f'
            OldVersion = '0.2.11'
            CurrentSetup = (Join-Path $assetDirectory $name)
            CurrentSetupSha256 = $seen[$name]
            CurrentExecutableSha256 = $env:EXPECTED_EXECUTABLE_SHA256
            CurrentVersion = $env:VERIFIED_VERSION
            TestRoot = (Join-Path $env:RUNNER_TEMP 'arm-installed-upgrade')
          }
          ./scripts/verify-installed-upgrade.ps1 @parameters
          $result = Get-Content -LiteralPath (Join-Path $parameters.TestRoot 'installed-upgrade-report.json') -Raw | ConvertFrom-Json
          if ($result.status -cne 'real-silent-install-upgrade-uninstall-passed' -or $result.upgradeVerified -ne $true -or
              $result.currentSetupSha256 -cne $seen[$name] -or $result.currentExecutableSha256 -cne $env:EXPECTED_EXECUTABLE_SHA256) {
            throw 'Installer lifecycle did not verify the exact reviewed installer.'
          }
      - name: Upload only package and lifecycle audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: Agent_Resource_Manager_delivery_audit_${{ github.run_id }}_${{ github.run_attempt }}
          path: |
            outputs/release-verification/BUILD_INFO.json
            outputs/release-verification/source-comparison.json
            outputs/release-assets/SHA256SUMS.txt
            ${{ runner.temp }}/arm-installed-upgrade/installed-upgrade-report.json
          if-no-files-found: warn
          retention-days: 14
