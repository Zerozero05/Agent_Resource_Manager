name: Verify installed Windows first launch
on: create
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-installation-wizard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'codex/installed-first-launch-c6bd682' }}
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      # The validation ref consumes the existing finalized candidate.
      CANDIDATE_RUN_ID: '44341382564'
      CANDIDATE_SOURCE: c6bd6821066b90fb0db5fdefd0792bc8cf828e53
      CANDIDATE_ARTIFACT: Agent_Resource_Manager_v0.3.0-dev.1_windows_x64_candidate_c6bd6821066b90fb0db5fdefd0792bc8cf828e53
      EXPECTED_EXECUTABLE_SHA256: e5001e79fb5bb18a847244846a43cdf9e9ae95f59e3ac4de0d63893ec044046d
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Verify the candidate run and independent executable pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:EXPECTED_EXECUTABLE_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw 'An independently verified candidate executable SHA256 is required.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -cne 'success' -or $run.head_sha -cne $env:CANDIDATE_SOURCE -or
              $run.run_attempt -ne 1 -or $run.path -cne '.github/workflows/check.yml' -or $run.event -cne 'push') {
            throw 'The independently verified candidate run is not available.'
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install locked packaging tools
        run: |
          npm install --global pnpm@11.25.0
          if ($LASTEXITCODE -ne 0) { throw 'Package manager installation failed' }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Locked packaging tool installation failed' }
      - name: Download and verify candidate, then prepare seven release assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-release.ps1 -CandidateRunId $env:CANDIDATE_RUN_ID -CandidateArtifact $env:CANDIDATE_ARTIFACT -ExpectedExecutableSha256 $env:EXPECTED_EXECUTABLE_SHA256
      - name: Complete the graphical installer in the hosted Windows session
        env:
          VERIFIED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $name = "Agent_Resource_Manager_v$($env:VERIFIED_VERSION)_windows_x64_setup.exe"
          $assetDirectory = Join-Path $env:GITHUB_WORKSPACE 'outputs/release-assets'
          $setupLine = @(Get-Content -LiteralPath (Join-Path $assetDirectory 'SHA256SUMS.txt') |
            Where-Object { $_ -cmatch ('^[0-9a-f]{64}  ' + [regex]::Escape($name) + '$') })
          if ($setupLine.Count -ne 1) { throw 'Expected exactly one packaged setup checksum' }
          ./scripts/verify-installed-wizard.ps1 -Setup (Join-Path $assetDirectory $name) -SetupSha256 ($setupLine[0].Substring(0, 64)) -ExecutableSha256 $env:EXPECTED_EXECUTABLE_SHA256 -Version $env:VERIFIED_VERSION -VerifyFirstLaunch
      - name: Upload graphical installation verification
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: Agent_Resource_Manager_installed_wizard_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm-installed-wizard/wizard-report.json
          if-no-files-found: warn
          retention-days: 14
