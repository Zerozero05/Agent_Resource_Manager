name: Verify Windows installation wizard
on: create
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-installation-wizard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'codex/installer-wizard-316c0ba7' }}
    runs-on: windows-latest
    env:
      # The validation ref consumes the existing finalized candidate.
      CANDIDATE_RUN_ID: '44299528537'
      CANDIDATE_ARTIFACT: Agent_Resource_Manager_v0.3.0-dev.1_windows_x64_candidate_52fff45240081984b46f44b091193d1ba14896d3
      EXPECTED_EXECUTABLE_SHA256: 316c0ba7d3f0bb037b7078cfeee702b80f50d1c65986de0ac1c49afac3fe6884
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install locked packaging tools
        run: |
          npm install --global pnpm@11.25.0
          if ($LASTEXITCODE -ne 0) { throw 'Package manager installation failed' }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Locked packaging tool installation failed' }
      - name: Download and verify candidate, then prepare seven release assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-release.ps1 -CandidateRunId $env:CANDIDATE_RUN_ID -CandidateArtifact $env:CANDIDATE_ARTIFACT -ExpectedExecutableSha256 $env:EXPECTED_EXECUTABLE_SHA256
      - name: Complete the graphical installer in the hosted Windows session
        env:
          VERIFIED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $name = "Agent_Resource_Manager_v$($env:VERIFIED_VERSION)_windows_x64_setup.exe"
          $assetDirectory = Join-Path $env:GITHUB_WORKSPACE 'outputs/release-assets'
          $setupLine = @(Get-Content -LiteralPath (Join-Path $assetDirectory 'SHA256SUMS.txt') |
            Where-Object { $_ -cmatch ('^[0-9a-f]{64}  ' + [regex]::Escape($name) + '$') })
          if ($setupLine.Count -ne 1) { throw 'Expected exactly one packaged setup checksum' }
          ./scripts/verify-installed-wizard.ps1 -Setup (Join-Path $assetDirectory $name) -SetupSha256 ($setupLine[0].Substring(0, 64)) -ExecutableSha256 $env:EXPECTED_EXECUTABLE_SHA256 -Version $env:VERIFIED_VERSION
      - name: Upload graphical installation verification
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: Agent_Resource_Manager_installed_wizard_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm-installed-wizard/wizard-report.json
          if-no-files-found: warn
          retention-days: 14
