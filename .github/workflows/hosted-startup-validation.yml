name: Compare native cold and warm startup on isolated Windows
on: create
permissions:
  contents: read
  actions: read
env:
  CANDIDATE_RUN_ID: '44907287993'
  CANDIDATE_JOB_ID: '136855468759'
  CANDIDATE_BRANCH: codex/maintenance-library-performance-20261121
  CANDIDATE_SOURCE: 5480977711719efadcb79c322931b7d2066a6f84
  CANDIDATE_ARTIFACT: Agent_Resource_Manager_v0.3.0-dev.1_windows_x64_candidate_5480977711719efadcb79c322931b7d2066a6f84
  CANDIDATE_ARTIFACT_ID: '14708534135'
  CANDIDATE_ARTIFACT_DIGEST: 'sha256:f45e69c72adb72cfcd7e506e3f9082e31d59de38824bdd12aa856b5a6a0049e0'
  CANDIDATE_SHA256: 09ab04ca510043aa38bba4fa398790b3212172699751a0920390190e4ba83274
  CANDIDATE_BUILD_INFO_SHA256: d7f9ae18dcc542477967d7ab2248b76356e971b179cc19e0c86e3b19d8329c52
  LEGACY_ARCHIVE_SHA256: 2a16a0f8c92937d17018f9c42a461a55bc5560f9b2f101a1e9a6e6d644e2170c
  LEGACY_EXECUTABLE_SHA256: 1ca90747eca2ac3229762928d05036724229e910463c28be40925e9b2fb2092f
jobs:
  startup:
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'codex/hosted-startup-5480977-20261121' && github.repository == 'Zerozero05/Agent_Resource_Manager' }}
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify the interactive runner and pinned executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
              -not [Environment]::UserInteractive -or [Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0 -or
              -not (Test-Path -LiteralPath 'D:\' -PathType Container)) { throw 'Expected a fresh hosted Windows interactive D-drive session.' }
          if (Get-Process -Name 'agent-resource-manager','skill-manager' -ErrorAction SilentlyContinue) { throw 'Expected no existing manager in the isolated runner.' }
          $changes = @(git diff --name-only $env:CANDIDATE_SOURCE HEAD --)
          if ($LASTEXITCODE -ne 0 -or $changes.Count -ne 1 -or $changes[0] -cne '.github/workflows/hosted-startup-validation.yml') {
            throw 'The test branch must differ from the exact candidate by the startup workflow only.'
          }
          ./scripts/verify-native-uia.ps1 -CompileOnly
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.id -ne $env:CANDIDATE_RUN_ID -or $run.head_sha -cne $env:CANDIDATE_SOURCE -or
              $run.head_branch -cne $env:CANDIDATE_BRANCH -or $run.run_attempt -ne 1 -or $run.path -cne '.github/workflows/check.yml' -or $run.event -cne 'push' -or
              $run.status -cne 'completed' -or $run.conclusion -cne 'success') { throw 'Candidate run identity differs.' }
          $job = gh api "repos/$env:GITHUB_REPOSITORY/actions/jobs/$env:CANDIDATE_JOB_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $job.id -ne $env:CANDIDATE_JOB_ID -or $job.run_id -ne $run.id -or
              $job.status -cne 'completed' -or $job.conclusion -cne 'success') { throw 'Candidate job identity differs.' }
          $artifact = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:CANDIDATE_ARTIFACT_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $artifact.id -ne $env:CANDIDATE_ARTIFACT_ID -or $artifact.name -cne $env:CANDIDATE_ARTIFACT -or
              $artifact.expired -or $artifact.digest -cne $env:CANDIDATE_ARTIFACT_DIGEST -or
              $artifact.workflow_run.id -ne $env:CANDIDATE_RUN_ID -or $artifact.workflow_run.head_sha -cne $env:CANDIDATE_SOURCE) {
            throw 'Candidate artifact identity differs.'
          }
          $candidate = Join-Path $env:RUNNER_TEMP 'arm-native-performance'
          $null = New-Item -ItemType Directory -Path $candidate -ErrorAction Stop
          $archivePath = Join-Path $candidate 'candidate.zip'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:CANDIDATE_ARTIFACT_ID/zip" -Headers $headers -OutFile $archivePath
          if (('sha256:' + (Get-FileHash -LiteralPath $archivePath).Hash.ToLowerInvariant()) -cne $env:CANDIDATE_ARTIFACT_DIGEST) {
            throw 'Downloaded Windows candidate ZIP digest differs.'
          }
          $exe = Join-Path $candidate 'agent-resource-manager.exe'
          $source = Join-Path $candidate 'BUILD_INFO.json'
          $archive = [IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            foreach ($path in @($exe, $source)) {
              $matches = @($archive.Entries | Where-Object { $_.FullName -ceq [IO.Path]::GetFileName($path) })
              if ($matches.Count -ne 1) { throw "Expected one exact root entry: $([IO.Path]::GetFileName($path))." }
              [IO.Compression.ZipFileExtensions]::ExtractToFile($matches[0], $path, $false)
            }
          } finally { $archive.Dispose() }
          $originalBuildInfoSha256 = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($originalBuildInfoSha256 -cne $env:CANDIDATE_BUILD_INFO_SHA256) { throw 'Original BUILD_INFO.json digest differs.' }
          $info = Get-Content -LiteralPath $source -Raw | ConvertFrom-Json
          $digest = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne $env:CANDIDATE_SHA256 -or $info.executableSha256 -cne $digest -or $info.sourceCommit -cne $env:CANDIDATE_SOURCE -or
              $info.workflowRunId -ne $env:CANDIDATE_RUN_ID -or $info.workflowRunAttempt -ne 1 -or
              $info.repository -cne $env:GITHUB_REPOSITORY -or $info.version -cne '0.3.0-dev.1') { throw 'Build provenance does not bind to the executable.' }
          $info | Add-Member -NotePropertyName buildMode -NotePropertyValue 'release'
          $info | Add-Member -NotePropertyName originalBuildInfoSha256 -NotePropertyValue $originalBuildInfoSha256
          $info | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $candidate 'BUILD_INFO.native-validation.json') -Encoding utf8NoBOM

          $name = 'Skill_Manager_v0.2.11_windows_x64_portable.zip'
          gh release download v0.2.11 --repo $env:GITHUB_REPOSITORY --pattern $name --dir $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Pinned v0.2.11 published archive download failed.' }
          $zip = Join-Path $candidate $name
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ine $env:LEGACY_ARCHIVE_SHA256) { throw 'Legacy archive checksum mismatch.' }
          $legacy = Join-Path $candidate 'v0.2.11'
          Expand-Archive -LiteralPath $zip -DestinationPath $legacy
          $files = @(Get-ChildItem -LiteralPath $legacy -Recurse -File -Filter 'skill-manager.exe')
          if ($files.Count -ne 1 -or (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash -ine $env:LEGACY_EXECUTABLE_SHA256) { throw 'Legacy executable checksum mismatch.' }
          @{exe=$files[0].FullName; buildMode='release'; version='0.2.11'; executableSha256=$env:LEGACY_EXECUTABLE_SHA256
            sourceCommit='c160c61ae7031f383237de0848ce733106ae0cac'; releaseAssetId=679297489} |
            ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $candidate 'baseline-build-info.json') -Encoding utf8NoBOM
      - name: Measure ten cold and ten warm launches per build
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'arm-native-performance'
          $root = 'D:\03_github_projects\Agent_Management\Agent_Resource_Manager\validation\manager-data'
          if (Test-Path -LiteralPath $root) { throw 'Expected a fresh native measurement directory.' }
          $baseline = Join-Path $candidate 'baseline-build-info.json'
          $legacy = Get-Content -LiteralPath $baseline -Raw | ConvertFrom-Json
          $arguments = @('--suite', 'startup', '--accessibility-input',
            '--candidate', (Join-Path $candidate 'agent-resource-manager.exe'),
            '--candidate-build-info', (Join-Path $candidate 'BUILD_INFO.native-validation.json'),
            '--baseline', $legacy.exe, '--baseline-build-info', $baseline)
          & node scripts/verify-uia-performance.mjs @arguments
          exit $LASTEXITCODE
      - name: Preserve reports and verify the original startup policy
        if: ${{ always() }}
        run: |
          $root = 'D:\03_github_projects\Agent_Management\Agent_Resource_Manager\validation\manager-data'
          $outputs = @(Get-ChildItem -LiteralPath $root -Directory -Filter 'uia-performance-*' -ErrorAction SilentlyContinue)
          if ($outputs.Count -ne 1) { throw 'Expected one isolated measurement directory.' }
          $out = $outputs[0].FullName
          $evidence = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'arm-native-startup-evidence')
          Get-ChildItem -LiteralPath $out -File | Where-Object {
            $_.Name -in @('report.json','observations.jsonl','policy-before-run.json') -or $_.Name -like '*-driver.json'
          } | Copy-Item -Destination $evidence.FullName
          $reportPath = Join-Path $out 'report.json'
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.suite -cne 'startup' -or $report.candidate.source -cne $env:CANDIDATE_SOURCE -or
              $report.candidate.sha256 -cne $env:CANDIDATE_SHA256 -or $report.baseline.sha256 -cne $env:LEGACY_EXECUTABLE_SHA256 -or
              $report.harnessChangedDuringRun -ne $false -or $report.nativeErrors.Count -ne 0 -or $report.error) {
            throw 'The exact startup run did not finish cleanly.'
          }
          $events = Get-Content -LiteralPath (Join-Path $out 'observations.jsonl') | ForEach-Object { $_ | ConvertFrom-Json }
          $exits = @($events | Where-Object { $_.kind -ceq 'native-normal-exit' -and $_.closedNormally -eq $true })
          [ordered]@{suite='startup'; executableSha256=$report.candidate.sha256; baselineSha256=$report.baseline.sha256
            reportSha256=(Get-FileHash -LiteralPath $reportPath -Algorithm SHA256).Hash.ToLowerInvariant()
            startup=$report.startup.verdict; normalExits=$exits.Count} | ConvertTo-Json -Depth 6 -Compress
          if ($exits.Count -ne 42 -or $report.startup.verdict.cold.status -cne 'passed' -or $report.startup.verdict.warm.status -cne 'passed') {
            throw 'Cold or warm startup did not meet the existing policy.'
          }
          foreach ($version in @('baseline','candidate')) {
            foreach ($condition in @('cold','warm')) {
              if ($report.startup.$version.$condition.Count -ne 10) { throw 'Startup samples are incomplete.' }
            }
          }
      - name: Upload only startup measurement evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: Agent_Resource_Manager_native_startup_5480977_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm-native-startup-evidence/
          if-no-files-found: warn
          retention-days: 14
