name: Verify native resource search keyboard focus
on: create
permissions:
  contents: read
  actions: read
env:
  CANDIDATE_RUN_ID: '44323802557'
  CANDIDATE_SOURCE: bbd51752eec3d616203ee7a0529d0d935b7cc8ba
  CANDIDATE_ARTIFACT: Agent_Resource_Manager_v0.3.0-dev.1_windows_x64_candidate_bbd51752eec3d616203ee7a0529d0d935b7cc8ba
jobs:
  candidate:
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'codex/hosted-focus-bbd5175' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the exact development build
        shell: pwsh
        run: |
          for ($tick = 0; $tick -lt 60; $tick++) {
            $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $run.head_sha -cne $env:CANDIDATE_SOURCE -or $run.run_attempt -ne 1 -or
                $run.path -cne '.github/workflows/check.yml' -or $run.event -cne 'push') { throw 'Wrong candidate build identity.' }
            if ($run.status -ceq 'completed') {
              if ($run.conclusion -cne 'success') { throw 'The exact Windows build failed.' }
              $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID/artifacts" | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or @($artifacts.artifacts | Where-Object { $_.name -ceq $env:CANDIDATE_ARTIFACT -and -not $_.expired }).Count -ne 1) {
                throw 'The exact Windows candidate artifact is missing.'
              }
              exit 0
            }
            Start-Sleep -Seconds 15
          }
          throw 'Timed out waiting for the bound build.'
  measure:
    needs: candidate
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [focus]
    defaults:
      run:
        shell: pwsh
    env:
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify runner and pinned executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
              -not [Environment]::UserInteractive -or [Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0 -or
              -not (Test-Path -LiteralPath 'D:\' -PathType Container)) { throw 'Expected a fresh hosted Windows interactive D-drive session.' }
          if (Get-Process -Name 'agent-resource-manager','skill-manager' -ErrorAction SilentlyContinue) { throw 'Expected no existing manager in the isolated runner.' }
          ./scripts/verify-native-uia.ps1 -CompileOnly
          $candidate = Join-Path $env:RUNNER_TEMP 'arm-native-performance'
          gh run download $env:CANDIDATE_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:CANDIDATE_ARTIFACT --dir $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Windows candidate download failed.' }
          $exe = Join-Path $candidate 'agent-resource-manager.exe'
          $source = Join-Path $candidate 'BUILD_INFO.json'
          $info = Get-Content -LiteralPath $source -Raw | ConvertFrom-Json
          $digest = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($info.executableSha256 -cne $digest -or $info.sourceCommit -cne $env:CANDIDATE_SOURCE -or
              $info.workflowRunId -ne $env:CANDIDATE_RUN_ID -or $info.workflowRunAttempt -ne 1 -or
              $info.repository -cne $env:GITHUB_REPOSITORY -or $info.version -cne '0.3.0-dev.1') { throw 'Build provenance does not bind to the executable.' }
          $info | Add-Member -NotePropertyName buildMode -NotePropertyValue 'release'
          $info | Add-Member -NotePropertyName originalBuildInfoSha256 -NotePropertyValue ((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant())
          $info | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $candidate 'BUILD_INFO.native-validation.json') -Encoding utf8NoBOM
          Write-Output "Verified $($info.sourceCommit) $digest in run $($info.workflowRunId)"
      - name: Capture actual Tab focus on the two search fields
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'arm-native-performance'
          & node scripts/verify-hosted-search-focus.mjs --candidate (Join-Path $candidate 'agent-resource-manager.exe') --candidate-build-info (Join-Path $candidate 'BUILD_INFO.native-validation.json')
          exit $LASTEXITCODE
      - name: Verify scope of the focus captures and preserve evidence
        if: ${{ always() }}
        run: |
          $parent = 'D:\03_github_projects\Agent_Management\Agent_Resource_Manager\validation\manager-data'
          $roots = @(Get-ChildItem -LiteralPath $parent -Directory -Filter 'hosted-search-focus-*' -ErrorAction SilentlyContinue)
          if ($roots.Count -ne 1) { throw 'Expected exactly one isolated focus report directory.' }
          $root = $roots[0].FullName
          $evidence = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'arm-focus-evidence')
          $result = Join-Path $root 'search-focus-result.json'
          foreach ($name in @('search-focus-result.json','native-driver.json')) {
            $file = Join-Path $root $name
            if (Test-Path -LiteralPath $file -PathType Leaf) { Copy-Item -LiteralPath $file -Destination $evidence.FullName }
          }
          $report = Get-Content -LiteralPath $result -Raw | ConvertFrom-Json
          $verified = 0
          foreach ($case in $report.cases) {
            foreach ($capture in $case.focus) {
              $name = [string]$capture.screenshot
              if ($name -cnotmatch '^(unified|tools)-(pointer|tab|shift-tab)\.png$') { throw 'Unexpected screenshot name.' }
              $file = Join-Path $root $name
              if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ine $capture.sha256) { throw 'Screenshot checksum mismatch.' }
              Copy-Item -LiteralPath $file -Destination $evidence.FullName
              $verified++
            }
          }
          [ordered]@{
            status=$report.status; error=$report.error; candidate=$report.candidate.sha256; verified=$verified
            closedNormally=$report.closedNormally; visualReviewRequired=$report.visualReviewRequired
            reportSha256=(Get-FileHash -LiteralPath $result -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json -Compress
          if ($report.candidate.source -cne $env:CANDIDATE_SOURCE -or $report.syntheticOnly -ne $true -or
              $report.status -cne 'captured-native-focus-evidence' -or $report.closedNormally -ne $true -or
              $report.cases.Count -ne 2 -or $verified -ne 6) { throw 'The focus sequence did not conclude with all exact controls and captures.' }
      - name: Upload only focus evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: Agent_Resource_Manager_native_search_focus_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm-focus-evidence/
          if-no-files-found: warn
          retention-days: 14
