name: Verify three native workloads on one hosted Windows machine (6239e8e)
on: create
permissions:
  contents: read
  actions: read
env:
  CANDIDATE_RUN_ID: '46078368860'
  CANDIDATE_JOB_ID: '140771331287'
  CANDIDATE_SOURCE: 6239e8ed54714105cc5da455a3c0d2be1cd9eed2
  CANDIDATE_ARTIFACT: Agent_Resource_Manager_v0.3.0-dev.1_windows_x64_candidate_6239e8ed54714105cc5da455a3c0d2be1cd9eed2
  CANDIDATE_ARTIFACT_ID: '15236642433'
  CANDIDATE_SHA256: 'eb3793edb58330369059705d7c3c57fdc22dce09fad0da840a94411f10ba5692'
  CANDIDATE_ARCHIVE_SHA256: '7bc6a8884b90d2a7712c48083c0d81cab88a1ea42f841e2afd11faa9490d5c43'
  CANDIDATE_BUILD_INFO_SHA256: '341c450380b378b005bf0d769fb90d9ecb30434cc21ef4e8d0a16cea1fb11493'
jobs:
  measure:
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'codex/hosted-combined-6239e8e-20261128' && github.repository == 'Zerozero05/Agent_Resource_Manager' }}
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify hosted runner and exact candidate provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "Agent_Resource_Manager_v0.3.0-dev.1_windows_x64_candidate_$env:CANDIDATE_SOURCE"
          if ($env:CANDIDATE_RUN_ID -cnotmatch '^[0-9]+$' -or $env:CANDIDATE_SOURCE -cnotmatch '^[0-9a-f]{40}$' -or
              $env:CANDIDATE_JOB_ID -cnotmatch '^[1-9][0-9]*$' -or
              $env:CANDIDATE_ARTIFACT -cne $name -or $env:CANDIDATE_ARTIFACT_ID -cnotmatch '^[0-9]+$' -or
              $env:CANDIDATE_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or $env:CANDIDATE_ARCHIVE_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:CANDIDATE_BUILD_INFO_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Pin the independently verified commit, asset identity, and ZIP, EXE and BUILD_INFO SHA-256 before measurement.'
          }
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
              -not [Environment]::UserInteractive -or [Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0 -or
              -not (Test-Path -LiteralPath 'D:\' -PathType Container)) { throw 'Expected a fresh hosted Windows interactive D-drive session.' }
          if (Get-Process -Name 'agent-resource-manager','skill-manager' -ErrorAction SilentlyContinue) { throw 'Expected no existing manager in the isolated runner.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -cne $env:CANDIDATE_SOURCE -or $run.run_attempt -ne 1 -or
              $run.head_branch -cne 'codex/skill-document-presentation-20261125' -or
              $run.path -cne '.github/workflows/check.yml' -or $run.event -cne 'push' -or
              $run.status -cne 'completed' -or $run.conclusion -cne 'success') { throw 'Wrong or unsuccessful candidate build identity.' }
          $job = gh api "repos/$env:GITHUB_REPOSITORY/actions/jobs/$env:CANDIDATE_JOB_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $job.id -ne $env:CANDIDATE_JOB_ID -or $job.run_id -ne $run.id -or
              $job.status -cne 'completed' -or $job.conclusion -cne 'success') { throw 'The exact Windows build job did not succeed.' }
          $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID/artifacts" | ConvertFrom-Json
          $match = @($artifacts.artifacts | Where-Object { $_.name -ceq $env:CANDIDATE_ARTIFACT -and -not $_.expired })
          if ($LASTEXITCODE -ne 0 -or $match.Count -ne 1 -or $match[0].id -ne $env:CANDIDATE_ARTIFACT_ID -or
              $match[0].digest -cne "sha256:$env:CANDIDATE_ARCHIVE_SHA256") { throw 'The exact Windows candidate artifact is missing.' }
          ./scripts/verify-native-uia.ps1 -CompileOnly
          $candidate = Join-Path $env:RUNNER_TEMP 'arm-native-performance'
          gh run download $env:CANDIDATE_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:CANDIDATE_ARTIFACT --dir $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Windows candidate download failed.' }
          $exe = Join-Path $candidate 'agent-resource-manager.exe'
          $source = Join-Path $candidate 'BUILD_INFO.json'
          $originalBuildInfoSha256 = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($originalBuildInfoSha256 -cne $env:CANDIDATE_BUILD_INFO_SHA256) { throw 'Candidate original BUILD_INFO digest changed.' }
          $info = Get-Content -LiteralPath $source -Raw | ConvertFrom-Json
          $digest = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne $env:CANDIDATE_SHA256 -or $info.executableSha256 -cne $digest -or
              $info.sourceCommit -cne $env:CANDIDATE_SOURCE -or $info.workflowRunId -ne $env:CANDIDATE_RUN_ID -or
              $info.workflowRunAttempt -ne 1 -or $info.repository -cne $env:GITHUB_REPOSITORY -or
              $info.version -cne '0.3.0-dev.1') { throw 'Build provenance does not bind to the pinned executable.' }
          $info | Add-Member -NotePropertyName buildMode -NotePropertyValue 'release'
          $info | Add-Member -NotePropertyName originalBuildInfoSha256 -NotePropertyValue $originalBuildInfoSha256
          $info | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $candidate 'BUILD_INFO.native-validation.json') -Encoding utf8NoBOM
          Write-Output "Verified $($info.sourceCommit) $digest in run $($info.workflowRunId), job $($job.id)"
      - name: Measure check, download, and update in separate native sessions
        timeout-minutes: 45
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'arm-native-performance'
          $root = 'D:\03_github_projects\Agent_Management\Agent_Resource_Manager\validation\manager-data'
          $resourceRoot = 'D:\03_github_projects\Agent_Management\Agent_Resource_Manager\validation\resources'
          if ((Test-Path -LiteralPath $root) -or (Test-Path -LiteralPath $resourceRoot)) {
            throw 'Expected fresh native measurement and resource directories.'
          }
          New-Item -ItemType Directory -Path $resourceRoot | Out-Null
          $audit = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'arm-native-performance-evidence')
          $sequence = @()
          foreach ($kind in @('check','download','update')) {
            $out = New-Item -ItemType Directory -Path (Join-Path $audit.FullName $kind)
            $record = [ordered]@{ workload=$kind; nativeExitCode=$null; normalExits=$null; reportReady=$false; error=$null }
            try {
              if (Get-Process -Name 'agent-resource-manager','skill-manager' -ErrorAction SilentlyContinue) {
                throw 'A previous manager process still exists. No new native session was started.'
              }
              $arguments = @('--suite', 'loads', '--load-kind', $kind, '--sample-overlap', 'true', '--accessibility-input',
                '--candidate', (Join-Path $candidate 'agent-resource-manager.exe'),
                '--candidate-build-info', (Join-Path $candidate 'BUILD_INFO.native-validation.json'))
              if ($kind -ceq 'download') {
                $specification = Join-Path $env:RUNNER_TEMP 'pinned-agent-reach-download.json'
                [ordered]@{repository='Panniantong/Agent-Reach'; tag='v1.6.0'; releaseId=421526768; assetId=668240314;
                  assetName='agent-reach.zip'; assetBytes=676536} | ConvertTo-Json -Compress |
                  Set-Content -LiteralPath $specification -Encoding utf8NoBOM
                $arguments += @('--download-spec', $specification, '--popup-select', 'true')
              }
              if ($kind -ceq 'update') {
                $generated = & node --input-type=module -e "import {createNativeLoadFixture, MAX_NATIVE_UPDATE_FIXTURES} from './scripts/performance-load-fixture.mjs'; import {join} from 'node:path'; const manifestPaths=[]; for(let index=0;index<MAX_NATIVE_UPDATE_FIXTURES;index++){ const f=await createNativeLoadFixture(); manifestPaths.push(join(f.root,'load-fixture.json')); } console.log(JSON.stringify(manifestPaths));"
                if ($LASTEXITCODE -ne 0) { throw 'Could not prepare independent synthetic update fixtures.' }
                $manifests = @($generated | ConvertFrom-Json)
                if ($manifests.Count -ne 36 -or @($manifests | Sort-Object -Unique).Count -ne 36) { throw 'The exact update fixture count was not created.' }
                foreach ($manifest in $manifests) { $arguments += @('--stage-fixture', $manifest) }
              }
              $before = @(Get-ChildItem -LiteralPath $root -Directory -Filter 'uia-performance-*' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
              $PSNativeCommandUseErrorActionPreference = $false
              & node scripts/verify-uia-performance.mjs @arguments
              $record.nativeExitCode = $LASTEXITCODE
              $new = @(Get-ChildItem -LiteralPath $root -Directory -Filter 'uia-performance-*' -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notin $before })
              if ($new.Count -ne 1) { throw 'Expected one new isolated measurement directory for this workload.' }
              $record['rawDirectory'] = $new[0].Name
              foreach ($name in @('report.json','observations.jsonl','policy-before-run.json','candidate-mixed-1000-100-driver.json')) {
                $source = Join-Path $new[0].FullName $name
                if (Test-Path -LiteralPath $source -PathType Leaf) { Copy-Item -LiteralPath $source -Destination $out.FullName }
              }
              $descriptor = Join-Path $new[0].FullName 'mixed-native-fixture/dataset.json'
              if (Test-Path -LiteralPath $descriptor -PathType Leaf) {
                $datasetDir = New-Item -ItemType Directory -Path (Join-Path $out.FullName 'mixed-native-fixture')
                Copy-Item -LiteralPath $descriptor -Destination $datasetDir.FullName
              }
              $report = Get-Content -LiteralPath (Join-Path $out.FullName 'report.json') -Raw | ConvertFrom-Json
              $driver = Get-Content -LiteralPath (Join-Path $out.FullName 'candidate-mixed-1000-100-driver.json') -Raw | ConvertFrom-Json
              $record['startupMs'] = $driver.startupMs
              $record['readinessBudgetMs'] = $driver.strictReadinessTimeoutMs
              $dataDir = Join-Path $new[0].FullName 'mixed-native-fixture\data'
              if ($driver.executableSha256 -cne $env:CANDIDATE_SHA256 -or $driver.strictReadinessTimeoutMs -ne 30000 -or
                  $report.loadSelection.kind -cne $kind -or $report.candidate.source -cne $env:CANDIDATE_SOURCE -or
                  $report.candidate.sha256 -cne $env:CANDIDATE_SHA256) { throw 'The workload does not bind the exact candidate and strict UI readiness with the 30-second load setup budget.' }
              if ($driver.dataDirectory -ne $dataDir -or $report.dataset.dataDir -ne $dataDir) {
                throw 'The workload did not use its own fresh synthetic dataset.'
              }
              $events = Get-Content -LiteralPath (Join-Path $out.FullName 'observations.jsonl') | ForEach-Object { $_ | ConvertFrom-Json }
              $record.normalExits = @($events | Where-Object { $_.kind -ceq 'native-normal-exit' -and $_.closedNormally -eq $true }).Count
              $record['reportStatus'] = $report.status
              $partialMeasurement = $record.nativeExitCode -eq 2 -and $report.status -ceq "native-$kind-overlap-samples-incomplete" -and
                -not $report.error -and -not $report.foregroundFailure -and $null -ne $report.nativeErrors -and @($report.nativeErrors).Count -eq 0
              if ($record.normalExits -ne 1 -or $driver.closedNormally -ne $true -or ($record.nativeExitCode -notin @(0,1) -and -not $partialMeasurement)) {
                throw 'The pinned native session did not exit normally with a measurement result.'
              }
              # Ready for independent replay. A partial result still fails the full sample gate.
              $record.reportReady = $true
            } catch {
              $record.error = $_.Exception.Message
            }
            $sequence += $record
            ConvertTo-Json -InputObject $sequence -Depth 5 | Set-Content -LiteralPath (Join-Path $audit.FullName 'sequence.json') -Encoding utf8NoBOM
            $record | ConvertTo-Json -Compress
          }
          exit 0
      - name: Recompute original P95 and bounded tolerance from raw evidence
        if: ${{ always() }}
        run: |
          $audit = Join-Path $env:RUNNER_TEMP 'arm-native-performance-evidence'
          $sequencePath = Join-Path $audit 'sequence.json'
          if (-not (Test-Path -LiteralPath $sequencePath -PathType Leaf)) { throw 'No hosted native workload evidence was taken.' }
          $sequence = Get-Content -LiteralPath $sequencePath -Raw | ConvertFrom-Json
          $reports = @($sequence | Where-Object reportReady | ForEach-Object { Join-Path $audit "$($_.workload)/report.json" })
          $PSNativeCommandUseErrorActionPreference = $false
          $combined = & node scripts/verify-sampled-load-evidence.mjs $env:CANDIDATE_SHA256 @reports
          $verifierExit = $LASTEXITCODE
          $combined | Set-Content -LiteralPath (Join-Path $audit 'combined-report.json') -Encoding utf8NoBOM
          $result = $combined | ConvertFrom-Json
          Write-Output "Original P95: $($result.originalP95). Limited tolerance: $($result.limitedTolerance)."
          foreach ($kind in @('check','download','update')) {
            $workload = $result.workloads.$kind
            if ($workload.sampleOverlap.acceptedInputs -ne 400) { throw "Expected 400 verified overlap inputs for $kind." }
            foreach ($category in @('search','filter','tab','document')) {
              if ($workload.sampleOverlap.categories.$category.count -ne 100) { throw "Expected 100 verified $category overlap inputs for $kind." }
            }
          }
          if ($verifierExit -ne 0 -or $result.status -cne 'passed') { throw 'The combined native results did not pass both existing thresholds. See combined-report.json.' }
      - name: Upload only synthetic measurement audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: Agent_Resource_Manager_native_combined_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm-native-performance-evidence/
          if-no-files-found: warn
          retention-days: 14
