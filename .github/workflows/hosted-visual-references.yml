name: Verify first hosted Skill search for 2314ea8
on: create
permissions:
  contents: read
  actions: read
env:
  CANDIDATE_RUN_ID: '44862742843'
  CANDIDATE_SOURCE: 2314ea88080a401be1acfa150d029f1a928b99aa
  CANDIDATE_ARTIFACT: Agent_Resource_Manager_v0.3.0-dev.1_windows_x64_candidate_2314ea88080a401be1acfa150d029f1a928b99aa
  CANDIDATE_ARTIFACT_ID: '14691310680'
  CANDIDATE_SHA256: 'b95ad24619e1d00e8d100777739afd70323fb827e272b31ef549124bd0063e97'
jobs:
  references:
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'codex/hosted-visual-first-search-fixed-2314ea8-20261121' }}
    runs-on: windows-latest
    timeout-minutes: 7
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify hosted runner and exact candidate provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:CANDIDATE_ARTIFACT_ID -cnotmatch '^[0-9]+$' -or $env:CANDIDATE_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Pin the independently verified candidate artifact ID and executable SHA256 before reference generation.'
          }
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
              -not [Environment]::UserInteractive -or [Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0 -or
              -not (Test-Path -LiteralPath 'D:\' -PathType Container)) { throw 'Expected a fresh hosted Windows interactive D-drive session.' }
          if (Get-Process -Name 'agent-resource-manager','skill-manager' -ErrorAction SilentlyContinue) { throw 'Expected no existing manager in the isolated runner.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -cne $env:CANDIDATE_SOURCE -or $run.run_attempt -ne 1 -or
              $run.path -cne '.github/workflows/check.yml' -or $run.event -cne 'push' -or
              $run.status -cne 'completed' -or $run.conclusion -cne 'success') { throw 'Wrong or unsuccessful candidate build identity.' }
          $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID/artifacts" | ConvertFrom-Json
          $match = @($artifacts.artifacts | Where-Object { $_.name -ceq $env:CANDIDATE_ARTIFACT -and -not $_.expired })
          if ($LASTEXITCODE -ne 0 -or $match.Count -ne 1 -or $match[0].id -ne $env:CANDIDATE_ARTIFACT_ID) { throw 'The exact Windows candidate artifact is missing.' }
          ./scripts/verify-native-uia.ps1 -CompileOnly
          & pwsh.exe -NoProfile -NonInteractive -File './scripts/native-visual-input.ps1' -CompileOnly
          if ($LASTEXITCODE -ne 0) { throw 'Visual helper did not pass its compile-only checks.' }
          $candidate = Join-Path $env:RUNNER_TEMP 'arm-native-performance'
          gh run download $env:CANDIDATE_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:CANDIDATE_ARTIFACT --dir $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Windows candidate download failed.' }
          $exe = Join-Path $candidate 'agent-resource-manager.exe'
          $source = Join-Path $candidate 'BUILD_INFO.json'
          $info = Get-Content -LiteralPath $source -Raw | ConvertFrom-Json
          $digest = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne $env:CANDIDATE_SHA256 -or $info.executableSha256 -cne $digest -or
              $info.sourceCommit -cne $env:CANDIDATE_SOURCE -or $info.workflowRunId -ne $env:CANDIDATE_RUN_ID -or
              $info.workflowRunAttempt -ne 1 -or $info.repository -cne $env:GITHUB_REPOSITORY -or
              $info.version -cne '0.3.0-dev.1') { throw 'Build provenance does not bind to the pinned executable.' }
          $info | Add-Member -NotePropertyName buildMode -NotePropertyValue 'release'
          $info | Add-Member -NotePropertyName originalBuildInfoSha256 -NotePropertyValue ((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant())
          $info | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $candidate 'BUILD_INFO.native-validation.json') -Encoding utf8NoBOM
          Write-Output "Verified $($info.sourceCommit) $digest in run $($info.workflowRunId)"
      - name: Observe only the first owned synthetic search
        id: generate
        timeout-minutes: 3
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $candidate = Join-Path $env:RUNNER_TEMP 'arm-native-performance'
          $exe = Join-Path $candidate 'agent-resource-manager.exe'
          $buildInfo = Join-Path $candidate 'BUILD_INFO.native-validation.json'
          $infoDigest = (Get-FileHash -LiteralPath $buildInfo -Algorithm SHA256).Hash.ToLowerInvariant()
          $approved = 'D:\03_github_projects\Agent_Management\Agent_Resource_Manager\validation\manager-data'
          $failure = Join-Path $env:RUNNER_TEMP 'arm-visual-reference-failure.json'
          $stage = 'validate-hosted-desktop'
          $desktop = $null
          $referenceFrame = $null
          $referenceError = $null
          $observation = $null
          try {
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class HostedReferenceDesktop {
              [StructLayout(LayoutKind.Sequential)]
              struct Rect { public int left, top, right, bottom; }
              [DllImport("user32.dll")]
              static extern IntPtr SetThreadDpiAwarenessContext(IntPtr value);
              [DllImport("user32.dll")]
              static extern int GetSystemMetrics(int value);
              [DllImport("user32.dll")]
              static extern uint GetDpiForSystem();
              [DllImport("user32.dll", EntryPoint = "SystemParametersInfoW", ExactSpelling = true)]
              static extern bool SystemParametersInfo(uint action, uint parameter, out Rect area, uint update);
              public static object Read() {
                  IntPtr previous = SetThreadDpiAwarenessContext(new IntPtr(-4));
                  if (previous == IntPtr.Zero) throw new InvalidOperationException("Desktop DPI context is unavailable.");
                  try {
                      Rect area;
                      // SPI_GETWORKAREA reads the usable desktop without changing display settings.
                      if (!SystemParametersInfo(0x30, 0, out area, 0)) throw new InvalidOperationException("Desktop work area is unavailable.");
                      return new {
                          monitors=GetSystemMetrics(80), left=GetSystemMetrics(76), top=GetSystemMetrics(77),
                          width=GetSystemMetrics(78), height=GetSystemMetrics(79), dpi=GetDpiForSystem(),
                          workArea=new { left=area.left, top=area.top, right=area.right, bottom=area.bottom }
                      };
                  } finally {
                      if (SetThreadDpiAwarenessContext(previous) == IntPtr.Zero) throw new InvalidOperationException("Desktop DPI context could not be restored.");
                  }
              }
          }
          '@
            $desktop = [HostedReferenceDesktop]::Read()
            $desktop | ConvertTo-Json -Depth 3 -Compress
            if ($desktop.monitors -ne 1 -or $desktop.dpi -le 0) {
              throw 'One hosted monitor with a readable DPI is required. No manager was launched.'
            }
            $left = [Math]::Max($desktop.left, $desktop.workArea.left)
            $top = [Math]::Max($desktop.top, $desktop.workArea.top)
            $right = [Math]::Min(($desktop.left + $desktop.width), $desktop.workArea.right)
            $bottom = [Math]::Min(($desktop.top + $desktop.height), $desktop.workArea.bottom)
            $width = [int][Math]::Ceiling(960 * $desktop.dpi / 96)
            $height = [int][Math]::Ceiling(650 * $desktop.dpi / 96)
            if ($width -gt ($right - $left) -or $height -gt ($bottom - $top)) {
              throw 'The compact reference window does not fit the hosted desktop work area. No manager was launched.'
            }
            $referenceFrame = [ordered]@{
              left=[Math]::Min(($left + 60), ($right - $width))
              top=[Math]::Min(($top + 60), ($bottom - $height))
              width=$width
              height=$height
              dpi=[int]$desktop.dpi
            }
            $stage = 'bind-verified-inputs'
            if (Test-Path -LiteralPath $approved) { throw 'Expected a fresh synthetic visual reference root.' }
            [IO.Directory]::CreateDirectory($approved) | Out-Null
            if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:CANDIDATE_SHA256) {
              throw 'The verified executable changed before reference generation.'
            }
            # Bind the verified local candidate and compact hosted geometry before preparing the fixture.
            $module = (Resolve-Path -LiteralPath 'scripts/verify-native-visual-stability.mjs').Path
            $entries = [ordered]@{
              executable = $exe
              buildInfo = $buildInfo
              candidateSha256 = $env:CANDIDATE_SHA256
              buildInfoSha256 = $infoDigest
              transportSha256 = $env:CANDIDATE_SHA256
              hostedReferenceFrame = $referenceFrame
              hostedFirstSearchProbe = $true
            }
            $text = [IO.File]::ReadAllText($module)
            foreach ($key in $entries.Keys) {
              $pattern = "(?m)^const $key = [^\r\n]+;(?=\r?$)"
              if ([regex]::Matches($text, $pattern).Count -ne 1) { throw "Expected one local constant: $key." }
              $literal = ConvertTo-Json -InputObject $entries[$key] -Compress
              $text = [regex]::Replace($text, $pattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($match) "const $key = $literal;" })
            }
            [IO.File]::WriteAllText($module, $text, [Text.UTF8Encoding]::new($false))
            & node --check $module
            if ($LASTEXITCODE -ne 0) { throw 'Bound reference script did not parse.' }
            $stage = 'prepare-synthetic-fixture'
            $prepare = @(& node $module --prepare)
            if ($LASTEXITCODE -ne 0) { throw 'The original visual fixture preparation did not complete.' }
            $prepared = ($prepare -join [Environment]::NewLine) | ConvertFrom-Json
            $descriptorPath = (Resolve-Path -LiteralPath $prepared.descriptor).Path
            $referenceRoot = Split-Path -Parent $descriptorPath
            if ($prepared.status -cne 'prepared-no-gui-run' -or [IO.Path]::GetFileName($descriptorPath) -cne 'visual-dataset.json' -or
                (Split-Path -Parent $referenceRoot) -ine $approved -or (Split-Path -Leaf $referenceRoot) -cnotmatch '^native-visual-[A-Za-z0-9]+$') {
              throw 'Expected the exact generated visual descriptor.'
            }
            $stage = 'observe-owned-first-search'
            $observationPath = Join-Path $referenceRoot 'first-search-observation.json'
            $capture = @(& node $module --references $descriptorPath)
            if ($LASTEXITCODE -ne 0) {
              $detail = Join-Path $referenceRoot 'reference-failure.json'
              if (Test-Path -LiteralPath $detail -PathType Leaf) {
                $referenceError = Get-Content -LiteralPath $detail -Raw | ConvertFrom-Json
              }
              if (Test-Path -LiteralPath $observationPath -PathType Leaf) {
                $observation = Get-Content -LiteralPath $observationPath -Raw | ConvertFrom-Json
              }
              throw 'The owned first-search diagnosis did not complete.'
            }
            $result = ($capture -join [Environment]::NewLine) | ConvertFrom-Json
            $driverPath = Join-Path $referenceRoot 'reference-driver.json'
            $descriptor = Get-Content -LiteralPath $descriptorPath -Raw | ConvertFrom-Json
            $observation = Get-Content -LiteralPath $observationPath -Raw | ConvertFrom-Json
            $driver = Get-Content -LiteralPath $driverPath -Raw | ConvertFrom-Json
            $stage = 'validate-first-search-observation'
            if ($result.status -cne 'diagnostic-first-search-observed' -or (Resolve-Path -LiteralPath $result.path).Path -ine $observationPath -or
                $descriptor.candidateSha256 -cne $env:CANDIDATE_SHA256 -or $descriptor.buildInfoSha256 -cne $infoDigest -or
                $descriptor.dataset.syntheticOnly -ne $true -or $descriptor.dataset.skillCount -ne 1000 -or $descriptor.dataset.toolCount -ne 100 -or
                $observation.status -cne $result.status -or $observation.syntheticOnly -ne $true -or $observation.normalExit -ne $true -or
                $observation.candidateSha256 -cne $env:CANDIDATE_SHA256 -or $observation.datasetFingerprint -cne $descriptor.dataset.dataFingerprint -or
                $observation.expectedSearch -cne 'perf-skill-0000' -or $observation.title.name -cne 'Perf Skill 0000' -or
                ($null -ne $observation.searchValue.observed -and $observation.searchValue.observed -cne $observation.expectedSearch) -or
                $observation.frame.foreground -ne $true -or $observation.frame.pid -ne $driver.pid -or
                $observation.frame.creationFileTime -cne $driver.creationFileTime -or $observation.frame.windowHandle -ne $driver.windowHandle -or
                $driver.executableSha256 -cne $env:CANDIDATE_SHA256 -or $driver.closedNormally -ne $true -or $driver.dataDirectory -ine $descriptor.dataset.dataDir) {
              throw 'The diagnostic receipt does not bind to the completed synthetic session and graceful exit.'
            }
            foreach ($field in $referenceFrame.Keys) {
              if ($observation.frame.$field -ne $referenceFrame[$field]) { throw 'The diagnostic frame differs from the hosted preflight.' }
            }
            $receipt = [ordered]@{
              status = $observation.status
              candidateSource = $env:CANDIDATE_SOURCE
              candidateSha256 = $env:CANDIDATE_SHA256
              candidateRunId = $env:CANDIDATE_RUN_ID
              candidateArtifactId = $env:CANDIDATE_ARTIFACT_ID
              desktop = $desktop
              observation = $observation
            }
            $output = Join-Path $env:RUNNER_TEMP 'arm-visual-first-search.json'
            $receipt | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath $output -Encoding utf8NoBOM
            $receipt | ConvertTo-Json -Depth 12 -Compress
          } catch {
            [ordered]@{status='reference-preflight-failed'; stage=$stage; candidateSource=$env:CANDIDATE_SOURCE;
              candidateSha256=$env:CANDIDATE_SHA256; message=$_.Exception.Message; referenceError=$referenceError;
              desktop=$desktop; referenceFrame=$referenceFrame; observation=$observation} |
              ConvertTo-Json -Depth 12 | Set-Content -LiteralPath $failure -Encoding utf8NoBOM
            throw
          }
      - name: Record a pre-reference failure
        if: ${{ always() && steps.generate.outcome != 'success' }}
        run: |
          $failure = Join-Path $env:RUNNER_TEMP 'arm-visual-reference-failure.json'
          if (!(Test-Path -LiteralPath $failure -PathType Leaf)) {
            [ordered]@{status='reference-preflight-failed'; stage='workflow-setup-or-candidate-preflight'; candidateSource=$env:CANDIDATE_SOURCE; candidateSha256=$env:CANDIDATE_SHA256} |
              ConvertTo-Json | Set-Content -LiteralPath $failure -Encoding utf8NoBOM
          }
      - name: Upload only the synthetic first-search observation
        if: ${{ steps.generate.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Agent_Resource_Manager_first_search_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm-visual-first-search.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload only the synthetic preflight failure receipt
        if: ${{ always() && steps.generate.outcome != 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Agent_Resource_Manager_visual_reference_failure_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm-visual-reference-failure.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify that the owned first result and search field are visible
        run: |
          function Test-SearchBounds($row, $frame) {
            $parts = ([string]$row.bounds).Split(',')
            if ($parts.Count -ne 4) { return $false }
            $bounds = foreach ($part in $parts) {
              $value = 0.0
              if (![double]::TryParse($part, [Globalization.NumberStyles]::Float, [Globalization.CultureInfo]::InvariantCulture, [ref]$value) -or
                  ![double]::IsFinite($value)) { return $false }
              $value
            }
            $left, $top, $width, $height = $bounds
            return $width -gt 0 -and $height -gt 0 -and $left -ge $frame.left -and $top -ge $frame.top -and
              ($left + $width) -le ($frame.left + $frame.width) -and ($top + $height) -le ($frame.top + $frame.height)
          }
          function Get-FirstSearchProblems($observation) {
            if ($observation.frame.foreground -ne $true -or $observation.normalExit -ne $true) {
              'The owned foreground session must exit normally.'
            }
            foreach ($scope in @('scoped', 'unscoped')) {
              $rows = @($observation.title.$scope)
              $row = $rows[0]
              if ($rows.Count -ne 1 -or $row.name -cne 'Perf Skill 0000' -or
                  $row.type -cne 'ControlType.Button' -or $row.enabled -ne $true) {
                "Expected one enabled Skill title button in the $scope query."
              } else {
                if ($row.offscreen -ne $false) { "The $scope Skill title is offscreen." }
                if (!(Test-SearchBounds $row $observation.frame)) { "The $scope Skill title is outside the owned frame." }
              }
            }
            if ($observation.title.scoped[0].bounds -cne $observation.title.unscoped[0].bounds) {
              'The scoped and unscoped queries located different Skill titles.'
            }
            $edits = @($observation.edits)
            $edit = $edits[0]
            if ($edits.Count -ne 1 -or $edit.name -cne '搜索 Skill' -or $edit.type -cne 'ControlType.Edit' -or
                $edit.enabled -ne $true -or $edit.offscreen -ne $false -or $edit.hasKeyboardFocus -ne $true -or
                !(Test-SearchBounds $edit $observation.frame)) {
              'Expected one visible, enabled and focused search edit inside the owned frame.'
            }
            if ($observation.searchValue.readable -ne $true -or $observation.searchValue.matchesExpected -ne $true -or
                $observation.searchValue.observed -cne 'perf-skill-0000') {
              'The focused search edit did not read back the exact synthetic query.'
            }
          }
          $receipt = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'arm-visual-first-search.json') -Raw | ConvertFrom-Json
          $problems = @(Get-FirstSearchProblems $receipt.observation)
          if ($problems.Count) { throw ('First search verification failed. ' + ($problems -join ' ')) }
          Write-Output 'The first Skill result and the still-focused search edit were visible in the owned frame. The session exited normally.'
