name: Prepare hosted visual references using the visible filter reset
on: create
permissions:
  contents: read
  actions: read
env:
  CANDIDATE_RUN_ID: '45399676483'
  CANDIDATE_BRANCH: 'codex/check-watcher-projection-20261124'
  CANDIDATE_SOURCE: '660451977f924eead9b16ceff72f17c1c61d9497'
  CANDIDATE_ARTIFACT: 'Agent_Resource_Manager_v0.3.0-dev.1_windows_x64_candidate_660451977f924eead9b16ceff72f17c1c61d9497'
  CANDIDATE_ARTIFACT_ID: '14924463108'
  CANDIDATE_SHA256: '51d077f6e87b565b8496cdca852aa80549921d74b63167bcbc102132fbf79a25'
  CANDIDATE_ARCHIVE_SHA256: '35f1cff4f8991262c82ce99313452e68c4c822a3db5711925ceb11d48da82d0f'
  CANDIDATE_BUILD_INFO_SHA256: 'a14841439708890bf287157e4da59d52325a4619c8d02277aa1f461cd3a675e5'
  FIRST_SEARCH_RUN_ID: '45404806541'
  FIRST_SEARCH_ARTIFACT_ID: '14925310573'
  FIRST_SEARCH_SHA256: '9da08164900bc7292a03748603c4c52d960ed1746e31e4544fd0f94d5a70c5f0'
  FIRST_SEARCH_ARCHIVE_SHA256: '077f3126146b0e37d04abfb5df4c4513f4790375e83586d61a63e467bf48eb33'
  FIRST_SEARCH_FIXTURE_SHA256: 'bd3bb8c680b1b7578d376583ab4b416c88ee47b66ae66b813bee455ca31ba3a1'
  FIRST_SEARCH_EDIT_BOUNDS: '411,294,501,52'
  FIRST_SEARCH_RESULT_BOUNDS: '433,671,201,31'
jobs:
  references:
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'codex/hosted-visual-references-6604519-20261124' && github.repository == 'Zerozero05/Agent_Resource_Manager' }}
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify hosted runner and exact candidate provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $expectedCandidateName = "Agent_Resource_Manager_v0.3.0-dev.1_windows_x64_candidate_$env:CANDIDATE_SOURCE"
          if ($env:CANDIDATE_ARTIFACT -cne $expectedCandidateName -or
              $env:CANDIDATE_ARTIFACT_ID -cnotmatch '^[0-9]+$' -or $env:CANDIDATE_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:CANDIDATE_ARCHIVE_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:CANDIDATE_BUILD_INFO_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Pin the independently verified candidate artifact ID, archive, executable and BUILD_INFO digests before reference generation.'
          }
          if ($env:FIRST_SEARCH_RUN_ID -cnotmatch '^[0-9]+$' -or $env:FIRST_SEARCH_ARTIFACT_ID -cnotmatch '^[0-9]+$' -or
              $env:FIRST_SEARCH_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or $env:FIRST_SEARCH_ARCHIVE_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:FIRST_SEARCH_FIXTURE_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:FIRST_SEARCH_EDIT_BOUNDS -cnotmatch '^\d+(,\d+){3}$' -or $env:FIRST_SEARCH_RESULT_BOUNDS -cnotmatch '^\d+(,\d+){3}$') {
            throw 'Pin the independently verified, same-candidate first-search receipt and geometry before reference generation.'
          }
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
              -not [Environment]::UserInteractive -or [Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0 -or
              -not (Test-Path -LiteralPath 'D:\' -PathType Container)) { throw 'Expected a fresh hosted Windows interactive D-drive session.' }
          if (Get-Process -Name 'agent-resource-manager','skill-manager' -ErrorAction SilentlyContinue) { throw 'Expected no existing manager in the isolated runner.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -cne $env:CANDIDATE_SOURCE -or $run.run_attempt -ne 1 -or
              $run.head_branch -cne $env:CANDIDATE_BRANCH -or
              $run.path -cne '.github/workflows/check.yml' -or $run.event -cne 'push' -or
              $run.status -cne 'completed' -or $run.conclusion -cne 'success') { throw 'Wrong or unsuccessful candidate build identity.' }
          $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID/artifacts" | ConvertFrom-Json
          $match = @($artifacts.artifacts | Where-Object { $_.name -ceq $env:CANDIDATE_ARTIFACT -and -not $_.expired })
          if ($LASTEXITCODE -ne 0 -or $match.Count -ne 1 -or $match[0].id -ne $env:CANDIDATE_ARTIFACT_ID -or
              $match[0].digest -cne "sha256:$env:CANDIDATE_ARCHIVE_SHA256") { throw 'The exact Windows candidate artifact is missing.' }
          $shortRun = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:FIRST_SEARCH_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $shortRun.run_attempt -ne 1 -or $shortRun.status -cne 'completed' -or
              $shortRun.conclusion -cne 'success') { throw 'The pinned same-candidate compact verification did not complete successfully.' }
          $shortArtifact = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:FIRST_SEARCH_ARTIFACT_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $shortArtifact.expired -or $shortArtifact.workflow_run.id -ne $env:FIRST_SEARCH_RUN_ID -or
              $shortArtifact.digest -cne "sha256:$env:FIRST_SEARCH_ARCHIVE_SHA256") {
            throw 'The pinned compact receipt does not match the independently verified artifact.'
          }
          ./scripts/verify-native-uia.ps1 -CompileOnly
          & pwsh.exe -NoProfile -NonInteractive -File './scripts/native-visual-input.ps1' -CompileOnly
          if ($LASTEXITCODE -ne 0) { throw 'Visual helper did not pass its compile-only checks.' }
          $candidate = Join-Path $env:RUNNER_TEMP 'arm-native-performance'
          gh run download $env:CANDIDATE_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:CANDIDATE_ARTIFACT --dir $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Windows candidate download failed.' }
          $exe = Join-Path $candidate 'agent-resource-manager.exe'
          $source = Join-Path $candidate 'BUILD_INFO.json'
          $originalBuildInfoSha256 = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($originalBuildInfoSha256 -cne $env:CANDIDATE_BUILD_INFO_SHA256) { throw 'The original BUILD_INFO.json does not match the independently verified digest.' }
          $info = Get-Content -LiteralPath $source -Raw | ConvertFrom-Json
          $digest = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne $env:CANDIDATE_SHA256 -or $info.executableSha256 -cne $digest -or
              $info.sourceCommit -cne $env:CANDIDATE_SOURCE -or $info.workflowRunId -ne $env:CANDIDATE_RUN_ID -or
              $info.workflowRunAttempt -ne 1 -or $info.repository -cne $env:GITHUB_REPOSITORY -or
              $info.version -cne '0.3.0-dev.1') { throw 'Build provenance does not bind to the pinned executable.' }
          $info | Add-Member -NotePropertyName buildMode -NotePropertyValue 'release'
          $info | Add-Member -NotePropertyName originalBuildInfoSha256 -NotePropertyValue $originalBuildInfoSha256
          $info | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $candidate 'BUILD_INFO.native-validation.json') -Encoding utf8NoBOM
          Write-Output "Verified $($info.sourceCommit) $digest in run $($info.workflowRunId)"
      - name: Generate owned synthetic ROI references only
        id: generate
        timeout-minutes: 18
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $candidate = Join-Path $env:RUNNER_TEMP 'arm-native-performance'
          $exe = Join-Path $candidate 'agent-resource-manager.exe'
          $buildInfo = Join-Path $candidate 'BUILD_INFO.native-validation.json'
          $infoDigest = (Get-FileHash -LiteralPath $buildInfo -Algorithm SHA256).Hash.ToLowerInvariant()
          $approved = 'D:\03_github_projects\Agent_Management\Agent_Resource_Manager\validation\manager-data'
          $failure = Join-Path $env:RUNNER_TEMP 'arm-visual-reference-failure.json'
          $stage = 'validate-hosted-desktop'
          $desktop = $null
          $referenceFrame = $null
          $referenceError = $null
          try {
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class HostedReferenceDesktop {
              [StructLayout(LayoutKind.Sequential)]
              struct Rect { public int left, top, right, bottom; }
              [DllImport("user32.dll")]
              static extern IntPtr SetThreadDpiAwarenessContext(IntPtr value);
              [DllImport("user32.dll")]
              static extern int GetSystemMetrics(int value);
              [DllImport("user32.dll")]
              static extern uint GetDpiForSystem();
              [DllImport("user32.dll", EntryPoint = "SystemParametersInfoW", ExactSpelling = true)]
              static extern bool SystemParametersInfo(uint action, uint parameter, out Rect area, uint update);
              public static object Read() {
                  IntPtr previous = SetThreadDpiAwarenessContext(new IntPtr(-4));
                  if (previous == IntPtr.Zero) throw new InvalidOperationException("Desktop DPI context is unavailable.");
                  try {
                      Rect area;
                      // SPI_GETWORKAREA reads the usable desktop without changing display settings.
                      if (!SystemParametersInfo(0x30, 0, out area, 0)) throw new InvalidOperationException("Desktop work area is unavailable.");
                      return new {
                          monitors=GetSystemMetrics(80), left=GetSystemMetrics(76), top=GetSystemMetrics(77),
                          width=GetSystemMetrics(78), height=GetSystemMetrics(79), dpi=GetDpiForSystem(),
                          workArea=new { left=area.left, top=area.top, right=area.right, bottom=area.bottom }
                      };
                  } finally {
                      if (SetThreadDpiAwarenessContext(previous) == IntPtr.Zero) throw new InvalidOperationException("Desktop DPI context could not be restored.");
                  }
              }
          }
          '@
            $desktop = [HostedReferenceDesktop]::Read()
            $desktop | ConvertTo-Json -Depth 3 -Compress
            if ($desktop.monitors -ne 1 -or $desktop.dpi -le 0) {
              throw 'One hosted monitor with a readable DPI is required. No manager was launched.'
            }
            $left = [Math]::Max($desktop.left, $desktop.workArea.left)
            $top = [Math]::Max($desktop.top, $desktop.workArea.top)
            $right = [Math]::Min(($desktop.left + $desktop.width), $desktop.workArea.right)
            $bottom = [Math]::Min(($desktop.top + $desktop.height), $desktop.workArea.bottom)
            $width = [int][Math]::Ceiling(960 * $desktop.dpi / 96)
            $height = [int][Math]::Ceiling(650 * $desktop.dpi / 96)
            if ($width -gt ($right - $left) -or $height -gt ($bottom - $top)) {
              throw 'The compact reference window does not fit the hosted desktop work area. No manager was launched.'
            }
            $referenceFrame = [ordered]@{
              left=[Math]::Min(($left + 60), ($right - $width))
              top=[Math]::Min(($top + 60), ($bottom - $height))
              width=$width
              height=$height
              dpi=[int]$desktop.dpi
            }
            if ($referenceFrame.left -ne 60 -or $referenceFrame.top -ne 60 -or
                $referenceFrame.width -ne 960 -or $referenceFrame.height -ne 650 -or $referenceFrame.dpi -ne 96) {
              throw 'The hosted frame does not match the verified compact first-search geometry. No manager was launched.'
            }
            $firstSearch = [ordered]@{
              runId = $env:FIRST_SEARCH_RUN_ID
              artifactId = $env:FIRST_SEARCH_ARTIFACT_ID
              sha256 = $env:FIRST_SEARCH_SHA256
              datasetFingerprint = $env:FIRST_SEARCH_FIXTURE_SHA256
              filteredSearchBounds = $env:FIRST_SEARCH_EDIT_BOUNDS
              resultBounds = $env:FIRST_SEARCH_RESULT_BOUNDS
            }
            $stage = 'bind-verified-inputs'
            if (Test-Path -LiteralPath $approved) { throw 'Expected a fresh synthetic visual reference root.' }
            [IO.Directory]::CreateDirectory($approved) | Out-Null
            if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:CANDIDATE_SHA256) {
              throw 'The verified executable changed before reference generation.'
            }
            # Bind the verified local candidate and compact hosted geometry before preparing the fixture.
            $module = (Resolve-Path -LiteralPath 'scripts/verify-native-visual-stability.mjs').Path
            $entries = [ordered]@{
              executable = $exe
              buildInfo = $buildInfo
              candidateSha256 = $env:CANDIDATE_SHA256
              buildInfoSha256 = $infoDigest
              transportSha256 = $env:CANDIDATE_SHA256
              hostedReferenceFrame = $referenceFrame
              hostedFirstSearchReceipt = $firstSearch
            }
            $text = [IO.File]::ReadAllText($module)
            foreach ($key in $entries.Keys) {
              $pattern = "(?m)^const $key = [^\r\n]+;(?=\r?$)"
              if ([regex]::Matches($text, $pattern).Count -ne 1) { throw "Expected one local constant: $key." }
              $literal = ConvertTo-Json -InputObject $entries[$key] -Compress
              $text = [regex]::Replace($text, $pattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($match) "const $key = $literal;" })
            }
            [IO.File]::WriteAllText($module, $text, [Text.UTF8Encoding]::new($false))
            & node --check $module
            if ($LASTEXITCODE -ne 0) { throw 'Bound reference script did not parse.' }
            $stage = 'prepare-synthetic-fixture'
            $prepare = @(& node $module --prepare)
            if ($LASTEXITCODE -ne 0) { throw 'The original visual fixture preparation did not complete.' }
            $prepared = ($prepare -join [Environment]::NewLine) | ConvertFrom-Json
            $descriptorPath = (Resolve-Path -LiteralPath $prepared.descriptor).Path
            $referenceRoot = Split-Path -Parent $descriptorPath
            if ($prepared.status -cne 'prepared-no-gui-run' -or [IO.Path]::GetFileName($descriptorPath) -cne 'visual-dataset.json' -or
                (Split-Path -Parent $referenceRoot) -ine $approved -or (Split-Path -Leaf $referenceRoot) -cnotmatch '^native-visual-[A-Za-z0-9]+$') {
              throw 'Expected the exact generated visual descriptor.'
            }
            $stage = 'capture-owned-references'
            $capture = @(& node $module --references $descriptorPath)
            if ($LASTEXITCODE -ne 0) {
              $detail = Join-Path $referenceRoot 'reference-failure.json'
              if (Test-Path -LiteralPath $detail -PathType Leaf) {
                $referenceError = Get-Content -LiteralPath $detail -Raw | ConvertFrom-Json
              }
              throw 'The original reference generation did not complete.'
            }
            $result = ($capture -join [Environment]::NewLine) | ConvertFrom-Json
            $referencePath = Join-Path $referenceRoot 'visual-references.json'
            $driverPath = Join-Path $referenceRoot 'reference-driver.json'
            $descriptor = Get-Content -LiteralPath $descriptorPath -Raw | ConvertFrom-Json
            $refs = Get-Content -LiteralPath $referencePath -Raw | ConvertFrom-Json
            $driver = Get-Content -LiteralPath $driverPath -Raw | ConvertFrom-Json
            $stage = 'validate-reference-receipt'
            if ($result.status -cne 'references-generated-review-required' -or $result.referenceCount -ne 72 -or
                $result.visualApprovalRequired -ne $true -or $result.pilotRequired -ne $true -or (Resolve-Path -LiteralPath $result.path).Path -ine $referencePath -or
                $descriptor.candidateSha256 -cne $env:CANDIDATE_SHA256 -or $descriptor.buildInfoSha256 -cne $infoDigest -or
                $descriptor.dataset.syntheticOnly -ne $true -or $descriptor.dataset.skillCount -ne 1000 -or $descriptor.dataset.toolCount -ne 100 -or
                $refs.candidateSha256 -cne $env:CANDIDATE_SHA256 -or $refs.datasetFingerprint -cne $descriptor.dataset.dataFingerprint -or
                $refs.semanticReferencePhaseCompleted -ne $true -or $refs.capture -cne 'foreground-owned-CopyFromScreen' -or
                $driver.executableSha256 -cne $env:CANDIDATE_SHA256 -or $driver.closedNormally -ne $true -or $driver.dataDirectory -ine $descriptor.dataset.dataDir) {
              throw 'The reference receipt does not bind to a completed synthetic session and graceful exit.'
            }
            foreach ($field in $referenceFrame.Keys) {
              if ($refs.frame.$field -ne $referenceFrame[$field]) { throw 'The captured reference frame differs from the hosted preflight.' }
            }
            $captureBounds = @($refs.frame.captureBounds)
            if ($captureBounds.Count -ne 4 -or $captureBounds[0] -lt 0 -or $captureBounds[1] -lt 0 -or
                $captureBounds[2] -lt 2 -or $captureBounds[3] -lt 2 -or
                ($captureBounds[0] + $captureBounds[2]) -gt $referenceFrame.width -or
                ($captureBounds[1] + $captureBounds[3]) -gt $referenceFrame.height) {
              throw 'Reference crops are not bound to the visible client area.'
            }
            foreach ($field in $firstSearch.Keys) {
              if ($refs.firstSearchPreflight.$field -cne $firstSearch[$field]) { throw 'The captured references do not bind to the verified first-search observation.' }
            }
            $sheets = @($refs.reviewSheets)
            $roiCount = @($refs.states.PSObject.Properties.Value | ForEach-Object { $_.rois }).Count
            if ($sheets.Count -ne 9 -or $roiCount -ne 210) { throw 'Expected exactly nine montage sheets from 210 synthetic crops.' }
            $sheetPaths = for ($i = 0; $i -lt $sheets.Count; $i++) {
              $sheet = $sheets[$i]
              $path = Join-Path $referenceRoot ("references/review-{0:D2}.png" -f ($i + 1))
              if ((Resolve-Path -LiteralPath $sheet.path).Path -ine $path -or
                  ((Get-Item -LiteralPath $path).Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                  (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $sheet.sha256) {
                throw 'A synthetic ROI review sheet failed its exact path or digest check.'
              }
              $path
            }
            $output = Join-Path $env:RUNNER_TEMP 'arm-visual-reference-review'
            New-Item -ItemType Directory -Path $output | Out-Null
            foreach ($path in @($descriptorPath, $referencePath, $driverPath) + $sheetPaths) { Copy-Item -LiteralPath $path -Destination $output }
            $stage = 'package-verified-individual-rois'
            $referenceSha256 = (Get-FileHash -LiteralPath $referencePath -Algorithm SHA256).Hash.ToLowerInvariant()
            $roiSource = Join-Path $referenceRoot 'references'
            $sourceDirectory = Get-Item -LiteralPath $roiSource
            if ($sourceDirectory -isnot [IO.DirectoryInfo] -or
                ($sourceDirectory.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'The frozen ROI source is not an ordinary owned directory.'
            }
            $roiTransport = Join-Path $env:RUNNER_TEMP 'arm-visual-reference-rois'
            $roiDestination = Join-Path $roiTransport 'references'
            New-Item -ItemType Directory -Path $roiTransport | Out-Null
            New-Item -ItemType Directory -Path $roiDestination | Out-Null
            $roiFiles = @(foreach ($state in $refs.states.PSObject.Properties) {
              if ($state.Name -cnotmatch '^(all|github|document|homeDocument|documentTab|closed|search-[0-9]{4})$') {
                throw 'An unexpected reference state cannot be packaged.'
              }
              for ($index = 0; $index -lt $state.Value.rois.Count; $index++) {
                $roi = $state.Value.rois[$index]
                $fileName = "$($state.Name)-$index.png"
                $sourcePath = Join-Path $roiSource $fileName
                if ($roi.path -ine $sourcePath) { throw 'The frozen ROI path is not its canonical owned path.' }
                $item = Get-Item -LiteralPath $sourcePath
                if ($item -isnot [IO.FileInfo] -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                    (Get-FileHash -LiteralPath $sourcePath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $roi.sha256) {
                  throw 'The frozen ROI failed its ordinary-file or original digest check.'
                }
                $destinationPath = Join-Path $roiDestination $fileName
                Copy-Item -LiteralPath $sourcePath -Destination $destinationPath
                if ((Get-FileHash -LiteralPath $destinationPath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $roi.sha256) {
                  throw 'The transported ROI does not match its frozen original.'
                }
                [ordered]@{path="references/$fileName"; state=$state.Name; index=$index; role=$roi.role; box=$roi.box; sha256=$roi.sha256}
              }
            })
            if ($roiFiles.Count -ne $roiCount) { throw 'The transported ROI count does not match the full frozen set.' }
            $roiManifest = Join-Path $roiTransport 'roi-files.json'
            [ordered]@{
              format = 'agent-resource-manager-native-visual-roi-transport-v1'
              syntheticOnly = $true
              candidateSource = $env:CANDIDATE_SOURCE
              candidateSha256 = $env:CANDIDATE_SHA256
              fixtureSha256 = $refs.datasetFingerprint
              referenceSha256 = $referenceSha256
              roiCount = $roiCount
              files = $roiFiles
            } | ConvertTo-Json -Depth 7 | Set-Content -LiteralPath $roiManifest -Encoding utf8NoBOM
            $receipt = [ordered]@{
              status = 'references-generated-review-required'
              candidateSource = $env:CANDIDATE_SOURCE
              candidateSha256 = $env:CANDIDATE_SHA256
              candidateRunId = $env:CANDIDATE_RUN_ID
              candidateArtifactId = $env:CANDIDATE_ARTIFACT_ID
              buildInfoSha256 = $infoDigest
              referenceSha256 = $referenceSha256
              roiTransportManifestSha256 = (Get-FileHash -LiteralPath $roiManifest -Algorithm SHA256).Hash.ToLowerInvariant()
              descriptorSha256 = (Get-FileHash -LiteralPath $descriptorPath -Algorithm SHA256).Hash.ToLowerInvariant()
              driverSha256 = (Get-FileHash -LiteralPath $driverPath -Algorithm SHA256).Hash.ToLowerInvariant()
              desktop = $desktop
              referenceFrame = $referenceFrame
              captureBounds = $captureBounds
              hostedFirstSearchReceipt = $firstSearch
              referenceWorkflow = [ordered]@{
                repository=$env:GITHUB_REPOSITORY; headSha=$env:GITHUB_SHA; runId=$env:GITHUB_RUN_ID; attempt=[int]$env:GITHUB_RUN_ATTEMPT
              }
              hostEnvironment = [ordered]@{
                imageOs=$env:ImageOS; imageVersion=$env:ImageVersion
                windowsVersion=[Environment]::OSVersion.Version.ToString(); nodeVersion=(& node --version)
              }
              referenceCount = 72
              roiCount = $roiCount
              sheets = $sheets.Count
              normalExit = $true
              visualReviewCompleted = $false
              pilotRun = $false
            }
            $receipt | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $output 'receipt.json') -Encoding utf8NoBOM
            $receipt | ConvertTo-Json -Depth 5 -Compress
          } catch {
            [ordered]@{status='reference-preflight-failed'; stage=$stage; candidateSource=$env:CANDIDATE_SOURCE;
              candidateSha256=$env:CANDIDATE_SHA256; message=$_.Exception.Message; referenceError=$referenceError;
              desktop=$desktop; referenceFrame=$referenceFrame} |
              ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $failure -Encoding utf8NoBOM
            throw
          }
      - name: Record a pre-reference failure
        if: ${{ always() && steps.generate.outcome != 'success' }}
        run: |
          $failure = Join-Path $env:RUNNER_TEMP 'arm-visual-reference-failure.json'
          if (!(Test-Path -LiteralPath $failure -PathType Leaf)) {
            [ordered]@{status='reference-preflight-failed'; stage='workflow-setup-or-candidate-preflight'; candidateSource=$env:CANDIDATE_SOURCE; candidateSha256=$env:CANDIDATE_SHA256} |
              ConvertTo-Json | Set-Content -LiteralPath $failure -Encoding utf8NoBOM
          }
      - name: Upload only synthetic reference sheets and bound manifests
        if: ${{ steps.generate.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Agent_Resource_Manager_visual_references_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm-visual-reference-review/
          if-no-files-found: error
          retention-days: 14
      - name: Upload the individually verified synthetic reference crops and crop manifest
        if: ${{ steps.generate.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Agent_Resource_Manager_visual_reference_rois_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm-visual-reference-rois/
          if-no-files-found: error
          retention-days: 14
      - name: Upload only the synthetic preflight failure receipt
        if: ${{ always() && steps.generate.outcome != 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Agent_Resource_Manager_visual_reference_failure_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm-visual-reference-failure.json
          if-no-files-found: error
          retention-days: 14
