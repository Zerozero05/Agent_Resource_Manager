name: Compare native check-only private memory
on: create
permissions:
  contents: read
  actions: read
env:
  BEFORE_SOURCE: 'c2aed09d8e90079a8f41682335a7606cadba99b2'
  BEFORE_RUN_ID: '44896797301'
  BEFORE_ARTIFACT_ID: '14703704901'
  BEFORE_ARCHIVE_SHA256: '34b7ca73644743071b269e49231f081490bea3f22b5671ce4bae5a2b7cee32d5'
  BEFORE_EXE_SHA256: '2d68c43280db7d0f6b6f6a2ad212d16e6eb5d4ad46d8d76d5569fbb770e2690a'
  BEFORE_BUILD_INFO_SHA256: 'c4847175a3269141f40c52bdd6d5cffe16beccb8228b4d06aa8b8688bd928eda'
  AFTER_SOURCE: '2d194880f48bbef0fe9613f3d2a5afffc3b2ce15'
  AFTER_RUN_ID: '44898573141'
  AFTER_ARTIFACT_ID: '14705483396'
  AFTER_ARCHIVE_SHA256: '75e6a6d6d198e3f7af41a27bc5014a84f5173778f62b1d81ef7a876ee5aba3a5'
  AFTER_EXE_SHA256: '3476141dfca5894b9d9c07254a3de5b7dcf682e65108e6d064b1c48fb866c2f0'
  AFTER_BUILD_INFO_SHA256: '9d3f26aca7d0aa4ba30c83147838acfa4b86cbb596886ec33e30b3c157756abe'
  REFERENCE_BRANCH: 'codex/hosted-visual-references-37f83f1-20261121'
  REFERENCE_RUN_ID: '44891823197'
  REFERENCE_COMMIT: 'f7447a0152edc42d131ec866e14c76023e10fdeb'
  REFERENCE_REVIEW_ARTIFACT_ID: '14702596823'
  REFERENCE_REVIEW_ARCHIVE_SHA256: 'f705bbd553009f47b3b8321ff18810be42b4aaab8c06831ca7461f66167dd4fb'
  REFERENCE_ROI_ARTIFACT_ID: '14702078337'
  REFERENCE_ROI_ARCHIVE_SHA256: 'c41735998b75561e0c94c4e599357c8cafdd33f0ba4da33d1582b5da4e8ebb24'
  REFERENCE_RECEIPT_SHA256: 'dbbecddebfe33291ab1c99b874befabf67455ebc540fd9e9b0b03306cdc525aa'
  APPROVAL_SHA256: 'e0716ff3da002c34bf7b39f42a088a9cc154d69f75ca9b51b9a30c53b57dc5fb'
jobs:
  short-check-only-pair:
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'codex/hosted-check-only-pair-2d19488-20261121' && github.repository == 'Zerozero05/Agent_Resource_Manager' }}
    runs-on: windows-latest
    timeout-minutes: 22
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require pins and an isolated interactive runner
        run: |
          $ids = @($env:BEFORE_RUN_ID, $env:BEFORE_ARTIFACT_ID, $env:AFTER_RUN_ID, $env:AFTER_ARTIFACT_ID,
              $env:REFERENCE_RUN_ID, $env:REFERENCE_REVIEW_ARTIFACT_ID, $env:REFERENCE_ROI_ARTIFACT_ID)
          $commits = @($env:BEFORE_SOURCE, $env:AFTER_SOURCE, $env:REFERENCE_COMMIT)
          $digests = @($env:BEFORE_ARCHIVE_SHA256, $env:BEFORE_EXE_SHA256, $env:BEFORE_BUILD_INFO_SHA256,
              $env:AFTER_ARCHIVE_SHA256, $env:AFTER_EXE_SHA256, $env:AFTER_BUILD_INFO_SHA256,
              $env:REFERENCE_REVIEW_ARCHIVE_SHA256, $env:REFERENCE_ROI_ARCHIVE_SHA256, $env:REFERENCE_RECEIPT_SHA256, $env:APPROVAL_SHA256)
          if (@($ids | Where-Object { $_ -cnotmatch '^[0-9]+$' }).Count -or
              @($commits | Where-Object { $_ -cnotmatch '^[0-9a-f]{40}$' }).Count -or
              @($digests | Where-Object { $_ -cnotmatch '^[0-9a-f]{64}$' }).Count -or
              $env:BEFORE_SOURCE -ceq $env:AFTER_SOURCE -or $env:BEFORE_RUN_ID -eq $env:AFTER_RUN_ID -or
              $env:BEFORE_ARTIFACT_ID -eq $env:AFTER_ARTIFACT_ID -or $env:BEFORE_EXE_SHA256 -ceq $env:AFTER_EXE_SHA256) {
              throw 'Both independent candidate archive, executable, and build-info digests and provenance pins are mandatory.'
          }
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
              -not [Environment]::UserInteractive -or [Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0 -or
              -not (Test-Path -LiteralPath 'D:\' -PathType Container) -or
              (Get-Process -Name agent-resource-manager,skill-manager -ErrorAction SilentlyContinue)) {
              throw 'A fresh hosted interactive Windows runner with a D drive and no running manager is required.'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify the source pair and retrieve exact upstream artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Read-GitHub([string]$endpoint) {
              $result = & gh api "repos/$env:GITHUB_REPOSITORY/$endpoint" | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw "Unable to read $endpoint." }
              return $result
          }
          function Read-Run([string]$id, [string]$commit, [string]$workflow, [string]$event) {
              $run = Read-GitHub "actions/runs/$id"
              if ($run.conclusion -cne 'success' -or $run.status -cne 'completed' -or
                  $run.head_sha -cne $commit -or $run.path -cne ".github/workflows/$workflow" -or
                  $run.event -cne $event -or $run.run_attempt -ne 1) {
                  throw 'Upstream release-mode candidate or reference job did not complete the exact successful attempt.'
              }
              return $run
          }
          function Get-Artifact([string]$run, [string]$id, [string]$name, [string]$digest, [string]$destination) {
              $artifact = Read-GitHub "actions/artifacts/$id"
              if ($artifact.name -cne $name -or $artifact.workflow_run.id -ne $run -or $artifact.expired -or
                  $artifact.digest -cne "sha256:$digest" -or (Test-Path -LiteralPath $destination)) {
                  throw 'Expected upstream artifact identity or archive digest did not match.'
              }
              $archive = "$destination.zip"
              if (Test-Path -LiteralPath $archive) { throw 'The archive destination already exists.' }
              $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
              Invoke-WebRequest -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$id/zip" -Headers $headers -OutFile $archive -TimeoutSec 90
              if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine $digest) {
                  throw 'The bytes received for the pinned artifact have the wrong archive digest.'
              }
              Expand-Archive -LiteralPath $archive -DestinationPath $destination
          }
          $sourcePair = Read-GitHub "compare/$($env:BEFORE_SOURCE)...$($env:AFTER_SOURCE)"
          $expectedChanges = @('CHANGELOG.md','README.md','src-tauri/src/tasks.rs','src/CheckControl.tsx','src/WorkspaceApp.tsx','src/tasks.ts','tests/check-ui.test.ts','tests/task-updates.test.ts','tests/workspace-close-ui.test.ts') | Sort-Object
          $expectedCommits = @($env:AFTER_SOURCE)
          if ($sourcePair.status -cne 'ahead' -or $sourcePair.ahead_by -ne $expectedCommits.Count -or
              ($sourcePair.commits.sha -join '|') -cne ($expectedCommits -join '|') -or
              $sourcePair.merge_base_commit.sha -cne $env:BEFORE_SOURCE -or
              (($sourcePair.files.filename | Sort-Object) -join '|') -cne ($expectedChanges -join '|')) {
              throw 'The paired source commits are not the intended compact global-check completion change.'
          }
          $null = Read-Run $env:BEFORE_RUN_ID $env:BEFORE_SOURCE 'check.yml' 'push'
          $null = Read-Run $env:AFTER_RUN_ID $env:AFTER_SOURCE 'check.yml' 'push'
          $reference = Read-Run $env:REFERENCE_RUN_ID $env:REFERENCE_COMMIT 'hosted-visual-references.yml' 'create'
          if ($reference.head_branch -cne $env:REFERENCE_BRANCH) { throw 'Unexpected visual reference branch.' }
          $namePrefix = 'Agent_Resource_Manager_v0.3.0-dev.1_windows_x64_candidate'
          Get-Artifact $env:BEFORE_RUN_ID $env:BEFORE_ARTIFACT_ID "${namePrefix}_$($env:BEFORE_SOURCE)" $env:BEFORE_ARCHIVE_SHA256 (Join-Path $env:RUNNER_TEMP 'arm-retention-before')
          Get-Artifact $env:AFTER_RUN_ID $env:AFTER_ARTIFACT_ID "${namePrefix}_$($env:AFTER_SOURCE)" $env:AFTER_ARCHIVE_SHA256 (Join-Path $env:RUNNER_TEMP 'arm-retention-after')
          Get-Artifact $env:REFERENCE_RUN_ID $env:REFERENCE_REVIEW_ARTIFACT_ID "Agent_Resource_Manager_visual_references_$($env:REFERENCE_RUN_ID)_1" $env:REFERENCE_REVIEW_ARCHIVE_SHA256 (Join-Path $env:RUNNER_TEMP 'arm-visual-approved-review')
          Get-Artifact $env:REFERENCE_RUN_ID $env:REFERENCE_ROI_ARTIFACT_ID "Agent_Resource_Manager_visual_reference_rois_$($env:REFERENCE_RUN_ID)_1" $env:REFERENCE_ROI_ARCHIVE_SHA256 (Join-Path $env:RUNNER_TEMP 'arm-visual-approved-rois')
      - name: Run both owned processes on the same check-only workload
        timeout-minutes: 16
        run: |
          $parameters = @{
              ReviewBundle = Join-Path $env:RUNNER_TEMP 'arm-visual-approved-review'
              RoiBundle = Join-Path $env:RUNNER_TEMP 'arm-visual-approved-rois'
              ApprovalFile = './scripts/hosted-history-visual-approval.json'
              ApprovalSha256 = $env:APPROVAL_SHA256
              ReferenceReceiptSha256 = $env:REFERENCE_RECEIPT_SHA256
              ReferenceCommit = $env:REFERENCE_COMMIT
              ReferenceRunId = $env:REFERENCE_RUN_ID
          }
          ./scripts/run-hosted-history-pair.ps1 @parameters
      - name: Preserve check-only comparison and owned-exit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Agent_Resource_Manager_short_check_only_pair_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm-retention-result/
          if-no-files-found: warn
          retention-days: 14
