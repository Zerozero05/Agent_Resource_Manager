name: Observe the Windows motion broadcast in isolation
on: create
permissions:
  contents: read
jobs:
  observe:
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'codex/hosted-motion-broadcast-20261121' && github.repository == 'Zerozero05/Agent_Resource_Manager' }}
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Observe only the session animation setting and native notifications
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              $env:RUNNER_OS -cne 'Windows' -or -not [Environment]::UserInteractive -or
              [Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0 -or
              $env:ImageOS -cne 'win25-vs2026' -or $env:ImageVersion -cne '20261116.315.1' -or
              (Get-Process -Name agent-resource-manager,skill-manager -ErrorAction SilentlyContinue)) {
            throw 'A fresh, matching hosted Windows desktop is required.'
          }
          Add-Type -LiteralPath 'scripts/HostedMotionNotifications.cs'
          $report = [ordered]@{status='incomplete'; image=$env:ImageVersion; scope='Native notification only; no manager, WebView, or user input.'; original=$null; restored=$null; flips=@()}
          $receiver = [HostedMotionNotifications]::new()
          try {
            $report.original = [HostedMotionNotifications]::AnimationsEnabled()
            foreach ($requested in @((-not $report.original), $report.original)) {
              $flip = [ordered]@{requested=$requested; requestQpc=[Diagnostics.Stopwatch]::GetTimestamp()}
              $report.flips += $flip
              [HostedMotionNotifications]::SetAnimations($requested)
              Start-Sleep -Milliseconds 800
              $flip.readback = [HostedMotionNotifications]::AnimationsEnabled()
              if ($flip.readback -ne $requested) { throw 'Unexpected session animation state.' }
              $flip.notifications = @($receiver.Snapshot() | Where-Object Qpc -GE $flip.requestQpc)
              $flip.matchingBroadcast = @($flip.notifications | Where-Object Action -EQ 0x1043).Count -gt 0
            }
            $report.status = 'observed'
          } catch {
            $report.error = $_.Exception.GetBaseException().Message
          } finally {
            try {
              if ($null -ne $report.original) {
                if ([HostedMotionNotifications]::AnimationsEnabled() -ne $report.original) {
                  [HostedMotionNotifications]::SetAnimations($report.original)
                }
                $report.restored = [HostedMotionNotifications]::AnimationsEnabled()
              }
            } finally {
              try { $receiver.Dispose() }
              finally { Write-Output ($report | ConvertTo-Json -Depth 8 -Compress) }
            }
          }
          if ($report.status -cne 'observed' -or $report.restored -ne $report.original) { exit 1 }
