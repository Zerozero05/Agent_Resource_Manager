name: Verify Windows reduced motion with native visible pixels
on: create
permissions:
  contents: read
  actions: read
env:
  CANDIDATE_RUN_ID: '44380557746'
  CANDIDATE_SOURCE: 3f703b18e92bd765678027404741f7844a9bd94e
  CANDIDATE_ARTIFACT: Agent_Resource_Manager_v0.3.0-dev.1_windows_x64_candidate_3f703b18e92bd765678027404741f7844a9bd94e
  CANDIDATE_ARTIFACT_ID: '14465615399'
  CANDIDATE_SHA256: f8e240df74644942c929cc8d0ad699e1369c7a51cedab662620e8152c4ab41af
jobs:
  motion:
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'codex/hosted-motion-pixels-3f703b1-r4' }}
    runs-on: windows-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify the exact hosted Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
              -not [Environment]::UserInteractive -or [Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0) {
            throw 'The visual diagnostic requires an isolated interactive GitHub-hosted Windows VM.'
          }
          if ($env:ImageVersion -cne '20261103.298.1') {
            throw "The selected runner image ($env:ImageVersion) differs from the same-candidate hosted startup evidence. No candidate was downloaded or started."
          }
          if ($env:CANDIDATE_ARTIFACT_ID -cnotmatch '^[0-9]+$' -or $env:CANDIDATE_SHA256 -cnotmatch '^[a-f0-9]{64}$') {
            throw 'Pin the independently verified artifact ID and executable SHA256 before measurement.'
          }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -cne $env:CANDIDATE_SOURCE -or $run.run_attempt -ne 1 -or
              $run.path -cne '.github/workflows/check.yml' -or $run.event -cne 'push' -or
              $run.status -cne 'completed' -or $run.conclusion -cne 'success') { throw 'Wrong or unsuccessful candidate build identity.' }
          $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID/artifacts" | ConvertFrom-Json
          $match = @($artifacts.artifacts | Where-Object { $_.name -ceq $env:CANDIDATE_ARTIFACT -and -not $_.expired })
          if ($LASTEXITCODE -ne 0 -or $match.Count -ne 1 -or $match[0].id -ne $env:CANDIDATE_ARTIFACT_ID) { throw 'Incorrect Windows candidate artifact.' }
          $target = Join-Path $env:RUNNER_TEMP 'arm-motion-pixels-candidate'
          gh run download $env:CANDIDATE_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:CANDIDATE_ARTIFACT --dir $target
          if ($LASTEXITCODE -ne 0) { throw 'The pinned Windows artifact could not be read.' }
          $info = Get-Content -LiteralPath (Join-Path $target 'BUILD_INFO.json') -Raw | ConvertFrom-Json
          $digest = (Get-FileHash -LiteralPath (Join-Path $target 'agent-resource-manager.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne $env:CANDIDATE_SHA256 -or $info.executableSha256 -cne $digest -or
              $info.sourceCommit -cne $env:CANDIDATE_SOURCE -or $info.workflowRunId -ne $env:CANDIDATE_RUN_ID -or
              $info.workflowRunAttempt -ne 1 -or $info.repository -cne $env:GITHUB_REPOSITORY -or
              $info.version -cne '0.3.0-dev.1') { throw 'Build information does not bind to the pinned executable.' }
      - name: Observe real visible hover feedback across Windows motion states
        timeout-minutes: 5
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'arm-motion-pixels-candidate/agent-resource-manager.exe'
          ./scripts/verify-hosted-motion-pixels.ps1 -Candidate $candidate -ExpectedSha256 $env:CANDIDATE_SHA256
      - name: Preserve only the synthetic motion trace
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: Agent_Resource_Manager_native_motion_pixels_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm-motion-pixels-evidence/motion-pixels.json
          if-no-files-found: warn
          retention-days: 14
