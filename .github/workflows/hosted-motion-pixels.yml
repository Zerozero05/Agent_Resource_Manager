name: Verify Windows reduced motion on an owned window
on: create
permissions:
  contents: read
  actions: read
env:
  CANDIDATE_RUN_ID: '44866595695'
  CANDIDATE_SOURCE: 3536ca0e5cf7c897b860b5ce32d8b415904b9e45
  CANDIDATE_ARTIFACT: Agent_Resource_Manager_v0.3.0-dev.1_windows_x64_candidate_3536ca0e5cf7c897b860b5ce32d8b415904b9e45
  CANDIDATE_ARTIFACT_ID: '14692802883'
  CANDIDATE_ARTIFACT_DIGEST: sha256:6b8afaf8ca811c866b1ecb46ae778bf1fc1c8c715e176b32101d5a3f0f2ab2a6
  CANDIDATE_SHA256: 'aa4ddbf7317b1b5b559153841f8a5fb72c3589af7f267b74efae6211f1a87ed7'
jobs:
  motion:
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'codex/hosted-wgc-motion-3536ca0-20261121' && github.repository == 'Zerozero05/Agent_Resource_Manager' }}
    runs-on: windows-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile the probe with the installed Windows SDK and confirm clipped WARP pixels
        timeout-minutes: 2
        run: |
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
              -not [Environment]::UserInteractive -or [Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0) {
            throw 'The capability probe requires an isolated interactive GitHub-hosted Windows VM.'
          }
          if ($env:ImageOS -cne 'win25-vs2026' -or $env:ImageVersion -cne '20261116.315.1') {
            throw "The hosted Windows image ($env:ImageOS $env:ImageVersion) differs from the successful WGC capability image."
          }
          Write-Host "Hosted Windows image: $env:ImageOS $env:ImageVersion"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $install) { throw 'The hosted x64 Visual C++ compiler is unavailable.' }
          Import-Module (Join-Path $install 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $install -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $build = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'arm-wgc/bin')
          $probe = Join-Path $build.FullName 'verify-hosted-wgc-motion.exe'
          $object = Join-Path $build.FullName 'verify-hosted-wgc-motion.obj'
          & cl.exe /nologo /std:c++17 /EHsc /W4 /WX /DARM_WGC_MOTION "/Fo$object" "/Fe$probe" scripts/verify-hosted-dxgi-row.cpp
          if ($LASTEXITCODE -ne 0) { throw 'Could not compile the one-row probe using the installed SDK.' }
          $synthetic = & $probe --synthetic
          if ($LASTEXITCODE -ne 0) { throw 'The in-memory WARP preflight failed.' }
          $result = $synthetic | ConvertFrom-Json
          if ($result.status -cne 'synthetic-row-exact' -or $result.desktopAccess -ne $false -or
              $result.first -ne 13417386 -or $result.second -ne 12246270) {
            throw 'Wrong colors, clipping, or access mode in the in-memory row.'
          }
          Write-Output $synthetic
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify the exact hosted Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:CANDIDATE_ARTIFACT_ID -cnotmatch '^[0-9]+$' -or $env:CANDIDATE_SHA256 -cnotmatch '^[a-f0-9]{64}$') {
            throw 'Pin the independently verified artifact ID and executable SHA256 before measurement.'
          }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -cne $env:CANDIDATE_SOURCE -or $run.run_attempt -ne 1 -or
              $run.path -cne '.github/workflows/check.yml' -or $run.event -cne 'push' -or
              $run.status -cne 'completed' -or $run.conclusion -cne 'success') { throw 'Wrong or unsuccessful candidate build identity.' }
          $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID/artifacts" | ConvertFrom-Json
          $match = @($artifacts.artifacts | Where-Object { $_.name -ceq $env:CANDIDATE_ARTIFACT -and -not $_.expired })
          if ($LASTEXITCODE -ne 0 -or $match.Count -ne 1 -or $match[0].id -ne $env:CANDIDATE_ARTIFACT_ID -or
              $match[0].digest -cne $env:CANDIDATE_ARTIFACT_DIGEST) { throw 'Incorrect Windows candidate artifact.' }
          $target = Join-Path $env:RUNNER_TEMP 'arm-wgc-candidate'
          gh run download $env:CANDIDATE_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:CANDIDATE_ARTIFACT --dir $target
          if ($LASTEXITCODE -ne 0) { throw 'The pinned Windows artifact could not be read.' }
          $info = Get-Content -LiteralPath (Join-Path $target 'BUILD_INFO.json') -Raw | ConvertFrom-Json
          $digest = (Get-FileHash -LiteralPath (Join-Path $target 'agent-resource-manager.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne $env:CANDIDATE_SHA256 -or $info.executableSha256 -cne $digest -or
              $info.sourceCommit -cne $env:CANDIDATE_SOURCE -or $info.workflowRunId -ne $env:CANDIDATE_RUN_ID -or
              $info.workflowRunAttempt -ne 1 -or $info.repository -cne $env:GITHUB_REPOSITORY -or
              $info.version -cne '0.3.0-dev.1') { throw 'Build information does not bind to the pinned executable.' }
      - name: Observe the four original motion conditions on the owned synthetic window
        timeout-minutes: 5
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'arm-wgc-candidate/agent-resource-manager.exe'
          ./scripts/verify-hosted-motion-pixels.ps1 -Candidate $candidate -ExpectedSha256 $env:CANDIDATE_SHA256
      - name: Preserve only the native motion report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: Agent_Resource_Manager_wgc_motion_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm-motion-pixels-evidence/motion-pixels.json
          if-no-files-found: warn
          retention-days: 14
