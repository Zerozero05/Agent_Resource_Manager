name: Diagnose Windows motion notifications and the owned WebView state
on: create
permissions:
  contents: read
  actions: read
env:
  CANDIDATE_RUN_ID: '44394986153'
  CANDIDATE_SOURCE: 65b14b96b7243e0339b3eb5f2fd4f92ae1898df6
  CANDIDATE_ARTIFACT: Agent_Resource_Manager_v0.3.0-dev.1_windows_x64_candidate_65b14b96b7243e0339b3eb5f2fd4f92ae1898df6
  CANDIDATE_ARTIFACT_ID: '14470108635'
  CANDIDATE_SHA256: '090dc7a9e4298b0153baee53c2f2f8329a2dc1a95708b4a9cfbf840e2d46ab91'
jobs:
  motion-notifications:
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'codex/hosted-motion-notify-65b14b9' && github.repository == 'Zerozero05/Agent_Resource_Manager' }}
    runs-on: windows-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the isolated Windows job
        run: |
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
              -not [Environment]::UserInteractive -or [Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0) {
            throw 'The observation requires an isolated interactive GitHub-hosted Windows VM.'
          }
          if ($env:ImageOS -cne 'win25-vs2026' -or $env:ImageVersion -cne '20261116.315.1') {
            throw "The hosted Windows image ($env:ImageOS $env:ImageVersion) differs from the successful DXGI capability image."
          }
          Write-Host "Hosted Windows image: $env:ImageOS $env:ImageVersion"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify the exact hosted Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:CANDIDATE_ARTIFACT_ID -cnotmatch '^[0-9]+$' -or $env:CANDIDATE_SHA256 -cnotmatch '^[a-f0-9]{64}$') {
            throw 'Pin the independently verified artifact ID and executable SHA256 before measurement.'
          }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -cne $env:CANDIDATE_SOURCE -or $run.run_attempt -ne 1 -or
              $run.path -cne '.github/workflows/check.yml' -or $run.event -cne 'push' -or
              $run.status -cne 'completed' -or $run.conclusion -cne 'success') { throw 'Wrong or unsuccessful candidate build identity.' }
          $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID/artifacts" | ConvertFrom-Json
          $match = @($artifacts.artifacts | Where-Object { $_.name -ceq $env:CANDIDATE_ARTIFACT -and -not $_.expired })
          if ($LASTEXITCODE -ne 0 -or $match.Count -ne 1 -or $match[0].id -ne $env:CANDIDATE_ARTIFACT_ID) { throw 'Incorrect Windows candidate artifact.' }
          $target = Join-Path $env:RUNNER_TEMP 'arm-motion-notification-candidate'
          gh run download $env:CANDIDATE_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:CANDIDATE_ARTIFACT --dir $target
          if ($LASTEXITCODE -ne 0) { throw 'The pinned Windows artifact could not be read.' }
          $info = Get-Content -LiteralPath (Join-Path $target 'BUILD_INFO.json') -Raw | ConvertFrom-Json
          $digest = (Get-FileHash -LiteralPath (Join-Path $target 'agent-resource-manager.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne $env:CANDIDATE_SHA256 -or $info.executableSha256 -cne $digest -or
              $info.sourceCommit -cne $env:CANDIDATE_SOURCE -or $info.workflowRunId -ne $env:CANDIDATE_RUN_ID -or
              $info.workflowRunAttempt -ne 1 -or $info.repository -cne $env:GITHUB_REPOSITORY -or
              $info.version -cne '0.3.0-dev.1') { throw 'Build information does not bind to the pinned executable.' }
      - name: Compare real OS notifications and read-only WebView motion state
        timeout-minutes: 4
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'arm-motion-notification-candidate/agent-resource-manager.exe'
          ./scripts/verify-hosted-motion-notifications.ps1 -Candidate $candidate -ExpectedSha256 $env:CANDIDATE_SHA256
      - name: Preserve only the notification diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: Agent_Resource_Manager_motion_notifications_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm-motion-notification-evidence/motion-notifications.json
          if-no-files-found: warn
          retention-days: 14
